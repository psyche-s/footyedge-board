name: BigBallsData Research Adapter Tests
on:
  pull_request:
    paths:
      - "scripts/bigballsdata-research.mjs"
      - "tests/bigballsdata-research.test.mjs"
      - ".github/workflows/ci-bigballsdata-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/bigballsdata-research.mjs
      - run: node --test tests/bigballsdata-research.test.mjs
