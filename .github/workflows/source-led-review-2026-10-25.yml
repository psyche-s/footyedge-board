name: One-time Oct 25 publisher-led pick corrections
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-led-review-2026-10-25.yml'
permissions:
  contents: write
concurrency:
  group: original-source-led-one-time
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source identification and independent-market review
        run: |
          node --check scripts/build-source-led-picks.mjs
          node --test tests/source-led-picks.test.mjs
          node scripts/build-source-led-picks.mjs
      - name: Verify match-specific sources, no odds and no archival pick rewrite
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const v=JSON.parse(fs.readFileSync("data/source-led/2026-10-25.json","utf8"));
          if(v.date!=="2026-10-25"||v.mode!=="independent_publisher_market_tips"||v.archiveUnmodified!==true||v.top5.length!==5||v.totals.three<5)throw Error("No complete source-led review");
          if(v.matches.some(m=>m.picks.some(p=>!p.marketEvidence?.explicitEditorialTip||!p.sourceProvenance?.length||p.odds!==null||p.ev!==null)))throw Error("Unverified pick, missing source, or invented market price");
          const board=JSON.parse(fs.readFileSync("data/boards/2026-10-25.json","utf8"));
          if(board.immutable!==true||board.state!=="locked"||board.top5?.length!==5)throw Error("Archived board modified");
          console.log("Verified new source-led review:",v.totals);
          NODE
      - name: Publish separate dated research overlay without rewriting frozen board
        run: |
          git config user.name "FootyEdge Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/source-led/2026-10-25.json
          if git diff --cached --quiet; then echo "No source-led changes";exit 0;fi
          git commit -m "data(original): publish October 25 multi-publisher source-led Top 3 and Top 5"
          git pull --rebase origin main
          git push origin HEAD:main
