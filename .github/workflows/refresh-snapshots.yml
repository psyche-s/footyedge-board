name: Refresh FootyEdge snapshots

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-snapshots.yml"

permissions:
  contents: write

concurrency:
  group: footyedge-snapshot-refresh
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh fixture horizon with retained-last-good semantics
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
        run: node scripts/refresh-fixture-horizon.mjs

      - name: Capture verified live snapshots or retain dated source on provider error
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Toronto date +%F)"
          for OFFSET in 0 1 2 3 4; do
            SNAP_DATE="$(TZ=America/Toronto date -d "$TODAY +$OFFSET day" +%F)"
            KEY="${SNAP_DATE//-/}"
            DIR="data/$SNAP_DATE"
            mkdir -p "$DIR"
            echo "Checking men's soccer snapshot $SNAP_DATE"

            if curl --fail --max-time 15 --retry 1 --silent --show-error               "https://footyedge-board.vercel.app/api/espn-scoreboard?dates=$KEY&limit=1000"               -o "/tmp/scoreboard-$KEY.json" &&
              jq -e '.events | type=="array"' "/tmp/scoreboard-$KEY.json" >/dev/null; then
              jq '{events: [.events[] | {id,uid,date,name,shortName,season,
                status:{displayClock:.status.displayClock,type:.status.type},
                competitions:[.competitions[0] | {id,competitors:[.competitors[] |
                  {id,homeAway,winner,score,team:{id:.team.id,displayName:.team.displayName,abbreviation:.team.abbreviation,logo:.team.logo}}],
                  odds:(.odds // [])}]}]}'                 "/tmp/scoreboard-$KEY.json" > "$DIR/scoreboard.json"
              echo "Live scoreboard captured: $SNAP_DATE"
            elif [[ -s "$DIR/scoreboard.json" ]] && jq -e '.events | type=="array"' "$DIR/scoreboard.json" >/dev/null; then
              echo "::warning::Scoreboard provider failed for $SNAP_DATE; retained dated repository snapshot; NOT live."
            else
              echo "::warning::Scoreboard unavailable for $SNAP_DATE; no empty slate inferred."
            fi

            # Future dates are schedule-only. Never refresh bookmaker prices
            # outside the single official native-odds publication capture.
            if [[ "$OFFSET" == "0" && ! -s "$DIR/odds.json" ]]; then
              echo "Same-day display odds source absent; no speculative fill."
            fi
          done

          if [[ -s "data/$TODAY/scoreboard.json" && -s "data/$TODAY/fixtures.json" ]]; then
            cp "data/$TODAY/scoreboard.json" data/latest-scoreboard.json
            cp "data/$TODAY/fixtures.json" data/latest-fixtures.json
            printf '%s\n' "$TODAY" > data/latest-date.txt
          else
            echo "::warning::Today's data incomplete. Preserve previous latest pointers."
          fi

      - name: Commit refreshed snapshots without changing locked picks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FootyEdge Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No source changes."
            exit 0
          fi
          git commit -m "chore(data): refresh dated fixtures with explicit provider-failure fallback [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
