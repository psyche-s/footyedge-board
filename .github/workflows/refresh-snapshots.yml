name: Refresh FootyEdge snapshots

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture current live board data
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Toronto date +%F)"
          KEY="${TODAY//-/}"
          mkdir -p "data/$TODAY"

          curl --fail --retry 3 --silent --show-error             "https://footyedge-board.vercel.app/api/espn-scoreboard?dates=$KEY&limit=1000"             -o "data/$TODAY/scoreboard.json"

          curl --fail --retry 3 --silent --show-error             "https://footyedge-board.vercel.app/api/football?endpoint=fixtures&date=$TODAY"             -o "data/$TODAY/fixtures.json"

          curl --fail --retry 3 --silent --show-error             "https://footyedge-board.vercel.app/api/football?endpoint=odds&date=$TODAY"             -o "data/$TODAY/odds.json"

          cp "data/$TODAY/scoreboard.json" data/latest-scoreboard.json
          cp "data/$TODAY/fixtures.json" data/latest-fixtures.json
          cp "data/$TODAY/odds.json" data/latest-odds.json
          printf '%s\n' "$TODAY" > data/latest-date.txt

      - name: Commit refreshed snapshot
        shell: bash
        run: |
          git config user.name "FootyEdge Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(data): refresh live soccer snapshot [skip ci]"
          git push
