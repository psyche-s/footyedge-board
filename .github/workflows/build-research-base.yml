name: Build FootyEdge Research Base
# Manual research refresh requested 2026-10-14; no changes to publishing guard.

on:
  push:
    branches: [main]
    paths:
      - 'assets/board-availability.js'
      - 'assets/czech-first-league.mjs'
      - 'scripts/build-research-base.mjs'
      - 'scripts/sync-asia-research.mjs'
      - '.github/workflows/build-research-base.yml'
  schedule:
    # Local midnight research before official 00:30 publication; EDT/EST alternatives.
    - cron: "0,15 4,5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footyedge-research-base
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Grade prior archived model forecasts before the next research run
        shell: bash
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(TZ=America/Toronto date +%H)" != "00" ]]; then
            echo "Skip duplicate local-hour research/review run."
            exit 0
          fi
          # Outcome grades are independent from unchanged official pick history.
          node scripts/review-shadow.mjs || echo "Optional model review unavailable; preserve official research run."
      - name: Validate and import licensed J1 and K League source before research
        env:
          FOOTYEDGE_ASIA_FEED_URL: ${{ secrets.FOOTYEDGE_ASIA_FEED_URL }}
          FOOTYEDGE_ASIA_FEED_TOKEN: ${{ secrets.FOOTYEDGE_ASIA_FEED_TOKEN }}
          FOOTYEDGE_ASIA_FEED_APPROVED: ${{ vars.FOOTYEDGE_ASIA_FEED_APPROVED }}
        run: |
          node --test tests/asia-leagues.test.mjs
          node scripts/sync-asia-research.mjs
      - name: Build deterministic stats research — today + next 4 days
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(TZ=America/Toronto date +%H)" != "00" ]]; then
            echo "Skipping duplicate UTC schedule outside Toronto 00:00 hour."
            exit 0
          fi
          TODAY="$(TZ=America/Toronto date +%F)"
          # A repair push rebuilds today only; scheduled midnight research still scouts five days.
          HORIZON=4
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$(TZ=America/Toronto date +%M)" != "00" ]]; then HORIZON=0; fi
          for OFFSET in $(seq 0 "$HORIZON"); do
            DATE="$(TZ=America/Toronto date -d "$TODAY +$OFFSET day" +%F)"
            echo "Building research base for $DATE"
            FORCE_RESEARCH=1 RESEARCH_DATE="$DATE" node scripts/build-research-base.mjs
          done
      - name: Commit research base
        shell: bash
        run: |
          git add -A -- data/research-base-*.json
          if [[ -d data/asia ]]; then git add -A -- data/asia/; fi
          if [[ -d data/model-reviews ]]; then git add -A -- data/model-reviews/; fi
          if git diff --cached --quiet; then
            echo "No research-base changes."
            exit 0
          fi
          git config user.name "FootyEdge Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(research): build deterministic daily stats base [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
