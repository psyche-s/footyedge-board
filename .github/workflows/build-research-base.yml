name: Build FootyEdge Research Base
# Manual research refresh requested 2026-10-14; no changes to publishing guard.

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: footyedge-research-base
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Grade prior archived model forecasts before the next research run
        shell: bash
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(TZ=America/Toronto date +%H)" != "00" ]]; then
            echo "Skip duplicate local-hour research/review run."
            exit 0
          fi
          # Outcome grades are independent from unchanged official pick history.
          node scripts/review-shadow.mjs || echo "Optional model review unavailable; preserve official research run."
      - name: Validate and import licensed J1 and K League source before research
        env:
          FOOTYEDGE_ASIA_FEED_URL: ${{ secrets.FOOTYEDGE_ASIA_FEED_URL }}
          FOOTYEDGE_ASIA_FEED_TOKEN: ${{ secrets.FOOTYEDGE_ASIA_FEED_TOKEN }}
          FOOTYEDGE_ASIA_FEED_APPROVED: ${{ vars.FOOTYEDGE_ASIA_FEED_APPROVED }}
        run: |
          node --test tests/asia-leagues.test.mjs
          node scripts/sync-asia-research.mjs
      - name: Build deterministic stats research — today + next 4 days
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(TZ=America/Toronto date +%H)" != "00" ]]; then
            echo "Skipping duplicate UTC schedule outside Toronto 00:00 hour."
            exit 0
          fi
          TODAY="$(TZ=America/Toronto date +%F)"
          # A code push checks tomorrow too so upcoming J1/Europe fixtures appear in preview.
          # Frozen current-day and older boards remain immutable.
          HORIZON=4
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$(TZ=America/Toronto date +%M)" != "00" ]]; then HORIZON=1; fi
          for OFFSET in $(seq 0 "$HORIZON"); do
            DATE="$(TZ=America/Toronto date -d "$TODAY +$OFFSET day" +%F)"
            echo "Building research base for $DATE"
            FORCE_RESEARCH=1 RESEARCH_DATE="$DATE" node scripts/build-research-base.mjs
          done
      - name: Refresh verifiable historical H2H for tomorrow's match details
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
        shell: bash
        run: |
          node --test tests/h2h-score-cache.test.mjs
          TOMORROW="$(TZ=America/Toronto date -d 'tomorrow' +%F)"
          if [[ -f "data/research-base-$TOMORROW.json" ]]; then
            H2H_DATE="$TOMORROW" node scripts/build-h2h-cache.mjs
          fi
      - name: Verify independent Top 3 market theses
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/market-diversity.test.mjs
      - name: Publish confidence-only tomorrow preview using verified research
        env:
          OWNER_RESEARCH_PICKS: "1"
        shell: bash
        run: |
          TOMORROW="$(TZ=America/Toronto date -d 'tomorrow' +%F)"
          if [[ -f "data/research-base-$TOMORROW.json" && ! -f "data/boards/$TOMORROW.json" ]]; then
            PREVIEW_DATE="$TOMORROW" node scripts/build-evidence-only-board.mjs
          fi
      - name: Test editorial parlay safeguards without writing model-built slips
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/daily-slips.test.mjs tests/editorial-refresh.test.mjs
          # The authorised editorial desk is published by the 00:30 freeze or
          # recovered by the 00:45 desk workflow. This preliminary research
          # job must not publish model-built SGPs or tomorrow's model slips.
      - name: Commit research base
        shell: bash
        run: |
          git add -A -- data/research-base-*.json
          git add -A -- data/board-drafts/ || true
          # Dated historical slips may exist, but no new model-built slips are staged.
          if [[ -d data/asia ]]; then git add -A -- data/asia/; fi
          if [[ -d data/h2h ]]; then git add -A -- data/h2h/; fi
          if [[ -d data/model-reviews ]]; then git add -A -- data/model-reviews/; fi
          if git diff --cached --quiet; then
            echo "No research-base changes."
            exit 0
          fi
          git config user.name "FootyEdge Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(research): build deterministic daily stats base [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
