name: Hide external preview links in older deployed FootyEdge
on:
  pull_request:
    branches: [main]
    paths: ["scripts/owner-hide-preview-links-oct09.mjs", ".github/workflows/owner-hide-preview-links-oct09.yml"]
  push:
    branches: [main]
    paths: ["scripts/owner-hide-preview-links-oct09.mjs", ".github/workflows/owner-hide-preview-links-oct09.yml"]
permissions:
  contents: write
concurrency:
  group: footyedge-old-ui-preview-link
  cancel-in-progress: false
jobs:
  hide-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify archive and original selection history
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"
          node --check scripts/owner-hide-preview-links-oct09.mjs
          node scripts/owner-hide-preview-links-oct09.mjs
          node scripts/validate-published-boards.mjs --base "$BASE"
          node --input-type=module <<'JS'
          import fs from "node:fs";import assert from "node:assert/strict";
          const b=JSON.parse(fs.readFileSync("data/boards/2026-10-09.json","utf8"));
          assert.ok(b.games.every(g=>!g.ownerEditorial?.source&&!g.ownerEditorial?.secondarySource));
          assert.equal(b.games.length,11);
          assert.equal(b.games.reduce((a,g)=>a+g.top3.length,0),26);
          JS
      - name: Publish GitHub raw board without Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/boards/2026-10-09.json data/board-revisions/2026-10-09
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "FootyEdge Editorial Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(board): hide third-party preview links in older deployed UI [skip ci]"
          git pull --rebase origin main
          node scripts/validate-published-boards.mjs --base origin/main
          git push origin HEAD:main
