name: FootyEdge Multi-Source Scouting
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/analytics_pipeline.py", "tests/test_analytics_pipeline.py", ".github/workflows/multi-source-scouting.yml"]
  schedule:
    - cron: "12 4 * * *"
    - cron: "12 5 * * *"
permissions:
  contents: write
concurrency:
  group: footyedge-multisource-scouting
  cancel-in-progress: false
jobs:
  scouting:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .cache/footyedge
          key: footyedge-csv-${{ runner.os }}-${{ github.run_id }}
          restore-keys: footyedge-csv-${{ runner.os }}-
      - name: Test exact match joins and missing metrics
        run: python -m unittest discover -s tests -p test_analytics_pipeline.py
      - name: Ingest published football data without touching published picks
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Toronto date +%F)"
          HOUR="$(TZ=America/Toronto date +%H)"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$HOUR" != "00" ]]; then exit 0; fi
          if [[ ! -s "data/research-base-$TODAY.json" ]]; then
            echo "::warning::Dated verified baseline unavailable; skipping"
            exit 0
          fi
          python scripts/analytics_pipeline.py --date "$TODAY"
          python -m json.tool "data/analytics/$TODAY.json" >/dev/null
      - name: Commit separate shadow analytics overlay
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Toronto date +%F)"
          if [[ ! -s "data/analytics/$TODAY.json" ]]; then exit 0; fi
          git config user.name "FootyEdge Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "data/analytics/$TODAY.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(analytics): source-tagged scouting overlay $TODAY [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
