name: Legacy FootyEdge Board Audit (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate immutable historical data
        run: |
          node scripts/validate-published-boards.mjs --base HEAD
          node --test tests/*.test.mjs
      - name: Never rewrite a locked board automatically
        run: echo "An audited historical correction requires a separate, explicit owner instruction."
