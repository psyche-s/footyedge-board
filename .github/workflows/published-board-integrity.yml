name: Published board integrity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce published data preservation
        env:
          PUBLISHED_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/validate-published-boards.mjs
      - name: Regression checks
        run: node --test tests/published-board.test.mjs
