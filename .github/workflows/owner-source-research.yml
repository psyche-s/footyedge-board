name: Publish Source Research Board
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-source-research.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/restore-full-slate-research-oct10.mjs
      - run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const b=JSON.parse(fs.readFileSync("data/boards/2026-10-10.json","utf8"));
          for(const g of b.games){if(g.top?.label!==(g.top3?.[0]?.label||undefined) && !(g.top===null&&!g.top3?.length))throw Error("Card mismatch: "+g.id);if(g.model?.top?.label!==g.top?.label)throw Error("Model mismatch: "+g.id);}
          console.log("Validated",b.games.length,"fixtures");
          '
      - run: |
          git config user.name "FootyEdge"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "publish source-research board" || exit 0
          git push
