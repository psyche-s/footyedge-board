name: FootyEdge Dixon-Coles shadow model

on:
  workflow_run:
    workflows: ['Build FootyEdge Research Base']
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/shadow_dixon_coles.py"
      - "assets/board-availability.js"
      - "scripts/backtest_shadow.py"
      - "scripts/compare-frozen-slates.mjs"
      - "scripts/review-shadow.mjs"
      - "tests/review-shadow.test.mjs"
      - "tests/test_shadow_model.py"
      - "tests/saudi-league.test.mjs"
      - "api/the-odds.js"
      - "scripts/audit-shadow-refresh.mjs"
      - "scripts/build-model-board.mjs"
      - "tests/model-board.test.mjs"
      - "ui/part2.html"
      - "tests/audit-shadow-refresh.test.mjs"
      - ".github/workflows/archive-board.yml"
      - ".github/workflows/shadow-dixon-coles.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/shadow_dixon_coles.py"
      - "scripts/backtest_shadow.py"
      - "scripts/compare-frozen-slates.mjs"
      - "scripts/review-shadow.mjs"
      - "tests/review-shadow.test.mjs"
      - "tests/test_shadow_model.py"
      - "scripts/audit-shadow-refresh.mjs"
      - "scripts/build-model-board.mjs"
      - "tests/model-board.test.mjs"
      - "ui/part2.html"
      - "tests/audit-shadow-refresh.test.mjs"
      - ".github/workflows/archive-board.yml"
      - ".github/workflows/shadow-dixon-coles.yml"
      - "requirements-shadow.txt"
  schedule:
    # One daily Toronto 05:35 run (DST/EST alternatives); local-hour gate below.
    - cron: "35 9 * * *"
    - cron: "35 10 * * *"

permissions:
  contents: write

concurrency:
  group: footyedge-dc-shadow
  cancel-in-progress: false

jobs:
  train-and-forecast:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-shadow.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Morning audit and model-board unit tests
        run: node --test tests/audit-shadow-refresh.test.mjs tests/model-board.test.mjs tests/saudi-league.test.mjs
      - name: Install modeling dependencies
        run: pip install -r requirements-shadow.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_shadow_model.py' -v
      - name: Historical domestic holdout (research only)
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            python scripts/backtest_shadow.py --dry-run
          elif [[ ! -f "data/model-backtests/2026-09-12_2026-09-21.json" ]]; then
            python scripts/backtest_shadow.py
          else
            echo "Immutable historical holdout result already archived."
          fi
      - name: Postmatch review JavaScript tests
        run: node --test tests/review-shadow.test.mjs
      - name: Original archived slate scorecard (not a DC comparison)
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            node scripts/compare-frozen-slates.mjs --dry-run
          else
            node scripts/compare-frozen-slates.mjs
          fi
      - name: Build shadow forecast (today only, Toronto)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(TZ=America/Toronto date +%H)" != "05" ]]; then
            echo "Skip duplicate UTC schedule."
            exit 0
          fi
          # Production picks are NEVER read or modified by this job.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            python scripts/shadow_dixon_coles.py --dry-run
          else
            git fetch --quiet origin main
            git pull --ff-only origin main
            python scripts/shadow_dixon_coles.py --capture-candidate --capture-expansion
          fi
      - name: Create model-vs-verified-odds sideboard (read-only)
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Dry-run against a mock fixture when dated live candidate is not yet archived.
            node --test tests/model-board.test.mjs
          else
            TODAY="$(TZ=America/Toronto date +%F)"
            if [[ -f "data/model-candidates/$TODAY.json" && -f "data/daily-odds-$TODAY.json" ]]; then
              node scripts/build-model-board.mjs --date "$TODAY"
            else
              echo "New model candidate or native odds not yet available; preserve official board."
            fi
          fi
      - name: Archive immutable model snapshots and fixed holdout
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Toronto date +%F)"
          FILES=("data/model-shadow/$TODAY.json" "data/model-candidates/$TODAY.json" "data/model-candidates-expanded/$TODAY.json" "data/model-backtests/2026-09-12_2026-09-21.json" "data/model-backtests/archived-originals-2026-10-05_06.json" "data/model-boards-v3/$TODAY.json")
          git config user.name "FootyEdge Model Bot"
          git config user.email "actions@users.noreply.github.com"
          for FILE in "${FILES[@]}"; do
            if [[ -f "$FILE" ]] && ! git ls-files --error-unmatch "$FILE" >/dev/null 2>&1; then
              git add "$FILE"
            fi
          done
          if git diff --cached --quiet; then
            echo "All model snapshots already archived; no overwrite."
            exit 0
          fi
          git commit -m "chore(model): archive pre-match evidence and holdout [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
