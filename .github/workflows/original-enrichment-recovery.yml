name: FootyEdge Original Supplemental Enrichment
on:
  push:
    paths:
      - "data/refresh-requests/enrich-2026-10-28.txt"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: footyedge-original-supplemental-enrichment
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recover dated verified research overlays without changing frozen board
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          TEAM_NEWS_DATE: "2026-10-28"
          H2H_DATE: "2026-10-28"
        run: |
          set -euo pipefail
          node --test tests/import-audited-predicted-xi.test.mjs
          node scripts/import-audited-predicted-xi.mjs
          node scripts/build-h2h-cache.mjs
          node scripts/audit-daily-refresh.mjs
      - name: Publish only supplemental data, never immutable picks
        run: |
          set -euo pipefail
          git config user.name "FootyEdge Enrichment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- data/team-intelligence/2026-10-28.json data/h2h/2026-10-28.json data/refresh-health/2026-10-28.json
          if git diff --cached --quiet; then
            echo "No independently verifiable enrichment was generated."
            exit 0
          fi
          git commit -m "data(original): publish verified Oct 28 enrichment [skip ci]"
          git pull --rebase origin main
          node scripts/validate-published-boards.mjs --base origin/main
          git push origin HEAD:main
