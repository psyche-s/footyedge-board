name: Sync FootyEdge Logo Cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/logo-sources.json"
      - "scripts/sync-football-logos.mjs"
      - ".github/workflows/sync-football-logos.yml"
  schedule:
    - cron: "20 9 1 * *"

permissions:
  contents: write

concurrency:
  group: footyedge-logo-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache football-logos.cc assets into repo
        run: node scripts/sync-football-logos.mjs
      - name: Commit refreshed logo cache
        shell: bash
        run: |
          if git diff --quiet -- assets/logos; then
            echo "Logo cache already current."
            exit 0
          fi
          git config user.name "FootyEdge Logo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/logos
          git commit -m "chore(logos): refresh football-logos.cc cache [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
