name: Verify FootyEdge Original API-Football key

# Manual, read-only. Never print, upload, forward or commit the credential.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: footyedge-original-api-football-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Authenticate API-Football (quota-free status)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_FOOTBALL_KEY: ${{ secrets.FSAPI }}
    steps:
      - name: Check GitHub Actions secret and authenticate without revealing key
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const key = process.env.API_FOOTBALL_KEY || "";
          if (!key) {
            console.error("::error::GitHub Actions secret FSAPI is missing or not accessible to this workflow. Check repository Actions secrets.");
            process.exitCode = 1;
          } else {
            try {
              const response = await fetch("https://v3.football.api-sports.io/status", {
                headers: { "x-apisports-key": key },
                signal: AbortSignal.timeout(10000)
              });
              const data = await response.json().catch(() => null);
              const errors = data?.errors && typeof data.errors === "object"
                ? Object.entries(data.errors).filter(([,v]) => Boolean(v)).map(([k]) => k)
                : [];
              const isAuthenticated = response.ok && errors.length === 0
                && data?.response && typeof data.response === "object"
                && !Array.isArray(data.response);
              if (!isAuthenticated) {
                console.error("::error::API-Football authentication failed. HTTP " + response.status
                  + "; error categories: " + (errors.join(", ") || "provider/response error")
                  + ". No credentials or response body printed.");
                process.exitCode = 1;
              } else {
                const q = data.response.requests || {};
                const current = Number.isFinite(q.current) ? q.current : "unavailable";
                const limit = Number.isFinite(q.limit) ? q.limit : "unavailable";
                console.log("API-Football authentication SUCCESS. Key was read from GitHub Actions secret FSAPI.");
                console.log("Quota used: " + current + " / " + limit + " (daily limit if returned).");
                console.log("This verifies GitHub Actions only; Vercel still requires a separate FOOTBALL environment variable.");
              }
            } catch {
              console.error("::error::API-Football status could not be reached or timed out. No credential printed.");
              process.exitCode = 1;
            }
          }
          NODE
