name: Rebuild Oct 25 sourced match reasons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-source-led-evidence-2026-10-25.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate curated publisher predictions
        run: |
          node --test tests/source-led-picks.test.mjs
          node scripts/build-source-led-picks.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('data/source-led/2026-10-25.json','utf8'));
          if(d.totals.three<15||d.top5.length!==5)throw Error('Not enough verified source market tips');
          if(!d.matches.some(m=>m.picks.some(p=>p.reason.includes('Match-specific research:'))))throw Error('Individual preview facts missing');
          console.log('Dated research verified',d.totals);
          NODE
      - name: Publish separate original website picks overlay
        run: |
          git config user.name "FootyEdge Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/source-led/2026-10-25.json
          if git diff --cached --quiet; then exit 0;fi
          git commit -m "data(original): publish 2026-10-25 source-led reasons with consensus checks"
          git pull --rebase origin main
          git push origin HEAD:main
