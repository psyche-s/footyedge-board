name: One Time Original Refresh Dispatch
on:
  push:
    paths:
      - '.github/workflows/dispatch-original-once-2026-10-25.yml'
permissions:
  contents: read
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Request one canonical run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run archive-board.yml -R psyche-s/footyedge-board --ref main
