name: Track FootyEdge Performance

on:
  schedule:
    # 07:00 Toronto EDT/EST alternatives; script gates on Toronto hour 07.
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footyedge-performance
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Track official Top 5 and run postmatch learning
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          FORCE_TRACK: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          node scripts/track-performance.mjs
          node scripts/postmatch-learning.mjs

      - name: Commit performance and learning data
        run: |
          if git diff --quiet -- data/performance data/postmortems; then
            echo "No performance/postmortem changes to commit."
            exit 0
          fi
          git config user.name "FootyEdge Tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data/performance data/postmortems
          git commit -m "Update FootyEdge performance and postmatch learning"
          git pull --rebase origin main
          git push origin HEAD:main
