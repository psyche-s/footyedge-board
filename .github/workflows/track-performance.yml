name: Track FootyEdge Performance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/track-performance.yml"
  schedule:
    # 00:05 Toronto EDT/EST alternatives; script gates on local hour 00.
    - cron: "5 4 * * *"
    - cron: "5 5 * * *"
    # Afternoon result settlement catches scores unavailable at midnight.
    - cron: "10 22 * * *"
    - cron: "10 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footyedge-performance
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify settlement grading rules
        run: node --test tests/track-performance.test.mjs

      - name: Track official Top 5 and run postmatch learning
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          FORCE_TRACK: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: |
          HOUR="$(TZ=America/Toronto date +%H)"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$HOUR" != "00" && "$HOUR" != "18" ]]; then echo "Outside Toronto settlement window"; exit 0; fi
          FORCE_TRACK=1 node scripts/track-performance.mjs
          node scripts/postmatch-learning.mjs

      - name: Commit performance and learning data
        run: |
          if git diff --quiet -- data/performance data/postmortems; then
            echo "No performance/postmortem changes to commit."
            exit 0
          fi
          git config user.name "FootyEdge Tracker"
          git config user.email "actions@users.noreply.github.com"
          git add data/performance data/postmortems
          git commit -m "Update FootyEdge performance and postmatch learning"
          git pull --rebase origin main
          git push origin HEAD:main
