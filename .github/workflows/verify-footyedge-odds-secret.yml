name: Verify FootyEdge GitHub Odds Secret
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-footyedge-odds-secret.yml"
      - "scripts/capture-github-odds.mjs"
      - "tests/github-odds-capture.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify key injection without revealing it or spending API credits
        env:
          THEODDSAPI: ${{ secrets.THEODDSAPI }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$THEODDSAPI" ]]; then
            echo "::error::GitHub Actions secret THEODDSAPI is missing or empty."
            exit 1
          fi
          echo "FootyEdge sportsbook key available to GitHub Actions. No API requests made."
      - name: Test safe bookmaker parsing and budget limits offline
        run: |
          node --check scripts/capture-github-odds.mjs
          node --test tests/github-odds-capture.test.mjs
