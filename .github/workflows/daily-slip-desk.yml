name: FootyEdge independent daily slip desk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-slip-desk.yml"
  schedule:
    # 00:45 Toronto in EDT / EST, after the published board and research files.
    - cron: "45 4,5 * * *"
permissions:
  contents: write
concurrency:
  group: footyedge-slip-desk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require the local midnight slot on scheduled runs
        id: window
        shell: bash
        run: |
          NOW="$(TZ=America/Toronto date +%H)"
          if [[ "${{ github.event_name }}" == "schedule" && "$NOW" != "00" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate model-built parlay research
        if: steps.window.outputs.run == 'true'
        run: |
          node --check scripts/build-daily-slips.mjs
          node --test tests/daily-slips.test.mjs
      - name: Generate real-data-only daily SGP and cross-game selections
        if: steps.window.outputs.run == 'true'
        env:
          REBUILD_DAILY_SLIPS: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node scripts/build-daily-slips.mjs
      - name: Publish dated slips without rewriting match picks
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FootyEdge Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/slips/
          if git diff --cached --quiet; then
            echo "Slip data unchanged"
            exit 0
          fi
          git commit -m "data(slips): publish independent matchup research [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
