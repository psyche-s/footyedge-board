name: FootyEdge licensed daily editorial slip desk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-slip-desk.yml"
      - "scripts/build-editorial-desk.mjs"
  schedule:
    # 00:45 Toronto in EDT / EST, after the published board and research files.
    - cron: "45 4,5 * * *"
permissions:
  contents: write
concurrency:
  group: footyedge-slip-desk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run editorial publication only during the local midnight slot, never on a code push
        id: window
        shell: bash
        run: |
          NOW="$(TZ=America/Toronto date +%H)"
          if [[ "${{ github.event_name }}" == "push" || "$NOW" != "00" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate the reviewed SGP and cross-game rules
        if: steps.window.outputs.run == 'true'
        run: |
          node --check scripts/build-editorial-desk.mjs
          node --test tests/editorial-refresh.test.mjs tests/daily-slips.test.mjs
      - name: Prepare source-reviewed editorial desk if midnight publication missed it
        if: steps.window.outputs.run == 'true'
        env:
          FOOTYEDGE_RESEARCH_FEED_URL: ${{ secrets.FOOTYEDGE_RESEARCH_FEED_URL }}
          FOOTYEDGE_RESEARCH_FEED_TOKEN: ${{ secrets.FOOTYEDGE_RESEARCH_FEED_TOKEN }}
          FOOTYEDGE_RESEARCH_FEED_APPROVED: ${{ vars.FOOTYEDGE_RESEARCH_FEED_APPROVED }}
        run: node scripts/build-editorial-desk.mjs
      - name: Publish dated slips without rewriting match picks
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FootyEdge Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/editorial-desk/
          if git diff --cached --quiet; then
            echo "Editorial desk unchanged"
            exit 0
          fi
          git commit -m "data(editorial): publish reviewed daily Top 3 and parlays [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
