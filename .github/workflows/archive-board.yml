name: Publish FootyEdge Daily Frozen Board

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-board.yml"
  schedule:
    # 00:30 Toronto: 04:30 UTC during EDT, 05:30 UTC during EST.
    - cron: "30,50 4,5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footyedge-board-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toronto 00:30 publication window (tolerates GitHub scheduler delay)
        id: gate
        shell: bash
        run: |
          HOUR="$(TZ=America/Toronto date +%H)"
          MINUTE="$(TZ=America/Toronto date +%M)"
          RUN=false
          # A manual dispatch cannot bypass the official freeze window.
          # 00:50 retries only if the first run did not publish; archive script is write-once.
          if [[ "$HOUR" == "00" && "$MINUTE" -ge 30 ]]; then RUN=true; fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "Official 00:30 Toronto gate=$RUN; current Toronto time=$HOUR:$MINUTE"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "22"

      - name: Settle prior boards and ingest post-match learning before picks
        if: steps.gate.outputs.run == 'true'
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          FORCE_TRACK: '1'
        run: |
          node scripts/track-performance.mjs
          node scripts/postmatch-learning.mjs

      - name: Install browser
        if: steps.gate.outputs.run == 'true'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify shadow model arrived before morning publication (advisory only)
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          # Refresh origin/main without changing the current checkout or official boards.
          git fetch --quiet origin main || echo "Shadow source ref refresh unavailable; publishing remains independent."
          node scripts/audit-shadow-refresh.mjs --ref origin/main

      - name: Capture verified native sportsbook odds once (GitHub secret, capped)
        if: steps.gate.outputs.run == 'true'
        env:
          THEODDSAPI: ${{ secrets.THEODDSAPI }}
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          ODDS_MAX_PAID_CALLS: "8"
          ODDS_MAX_CREDITS: "20"
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/capture-github-odds.mjs
          if [[ -n "$THEODDSAPI" ]]; then
            node scripts/capture-github-odds.mjs
          else
            echo "::warning::GitHub THEODDSAPI secret unavailable; using existing Vercel capture fallback."
            node scripts/capture-native-odds.mjs
          fi

      - name: Evidence-only recovery when sportsbook quota is exhausted
        if: steps.gate.outputs.run == 'true'
        env:
          OWNER_RESEARCH_PICKS: "1"
        run: node scripts/build-evidence-only-board.mjs

      # Missing leagues are restored from independently verified dated research.
      # If native bookmaker quota is exhausted, publish evidence-only leans with
      # null odds and null EV rather than backfilling stale sportsbook prices.
      - name: Build today's complete board only
        if: steps.gate.outputs.run == 'true'
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          PREVIEW_DAYS: "0"
          FORCE_TODAY_CAPTURE: "1"
          FAST_CAPTURE: "1"
        shell: bash
        run: |
          TODAY="$(TZ=America/Toronto date +%F)"
          if timeout 145s node scripts/publish-board-previews.mjs; then
            echo "Refreshed same-day candidate draft."
          else
            echo "::warning::Browser capture failed. Retain current Top 5."
            FORCE_FALLBACK=1 node scripts/build-evidence-only-board.mjs
          fi

      - name: Restore last-five form and three market-diverse picks before freeze
        if: steps.gate.outputs.run == 'true'
        run: |
          node --check scripts/ensure-daily-research-picks.mjs
          node scripts/ensure-daily-research-picks.mjs

      - name: Publish and lock current-day picks once
        if: steps.gate.outputs.run == 'true'
        run: node scripts/archive-board.mjs

      - name: Apply loss-risk-adjusted confidence before official commit
        if: steps.gate.outputs.run == 'true'
        run: |
          node --check scripts/apply-loss-risk.mjs
          node scripts/apply-loss-risk.mjs
          node scripts/validate-public-metrics.mjs

      - name: Audit published board editorial quality
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/audit-editorial-board.mjs

      - name: Validate and commit immutable same-day picks
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          TODAY="$(TZ=America/Toronto date +%F)"
          mkdir -p data/board-drafts data/boards
          node scripts/validate-published-boards.mjs --base origin/main
          node scripts/validate-public-metrics.mjs
          git config user.name "FootyEdge Board Bot"
          git config user.email "actions@users.noreply.github.com"
          files=(data/performance data/postmortems)
          for file in "data/board-drafts/$TODAY.json" "data/boards/$TODAY.json" "data/daily-odds-$TODAY.json"; do
            if [[ -f "$file" ]]; then files+=("$file"); fi
          done
          git add -A -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No board changes."
            exit 0
          fi
          git commit -m "chore(board): freeze same-day Top 5 $TODAY [skip ci]"
          git pull --rebase origin main
          node scripts/validate-published-boards.mjs --base origin/main
          git push origin HEAD:main

      - name: Publish frozen Top 5 to GitHub Releases when picks qualify
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Toronto date +%F)"
          if ! jq -e '.top5 | length > 0' "data/boards/$TODAY.json" >/dev/null; then
            echo "No qualifying Top 5 for $TODAY; PASS-only board is already published."
            exit 0
          fi
          # Release data only after the board exists, is locked and passes export checks.
          node scripts/export-release-top5.mjs
          archive="footyedge-board-${TODAY}"
          current="footyedge-board-current"
          if ! gh release view "$archive" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$archive" --repo "$GH_REPO" --target main --title "FootyEdge frozen Top 5 $TODAY" --notes-file published/footyedge-top5.json --latest=false
          fi
          if gh release view "$current" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$current" --repo "$GH_REPO" --notes-file published/footyedge-top5.json
          else
            gh release create "$current" --repo "$GH_REPO" --target main --title "FootyEdge current Top 5" --notes-file published/footyedge-top5.json --latest=false
          fi
          echo "Published frozen Top 5 as release data; no website build required."
