name: Publish and Lock FootyEdge Boards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-board.yml"
      - "scripts/publish-board-previews.mjs"
      - "scripts/archive-board.mjs"
      - "ui/part1.html"
      - "ui/part2.html"
      - "picks.html"
  schedule:
    # Rolling preview refresh: one of these is 05:35 Toronto depending on DST.
    - cron: "35 9 * * *"
    - cron: "35 10 * * *"
    # Official 06:00 Toronto lock: one of these is correct depending on DST.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    # Lock fallback if GitHub's first scheduled run was delayed.
    - cron: "20 10 * * *"
    - cron: "20 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footyedge-board-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Refresh rolling preview boards
        if: github.event_name != 'schedule' || github.event.schedule == '35 9 * * *' || github.event.schedule == '35 10 * * *'
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          PREVIEW_DAYS: "4"
        run: node scripts/publish-board-previews.mjs
      - name: Lock today's official board when Toronto has reached 06:00
        run: node scripts/archive-board.mjs
      - name: Commit preview / lock changes
        shell: bash
        run: |
          mkdir -p data/board-drafts data/boards
          git config user.name "FootyEdge Board Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- data/board-drafts data/boards
          if git diff --cached --quiet; then
            echo "No board changes."
            exit 0
          fi
          git commit -m "chore(board): refresh rolling previews / 6am lock [skip ci]"
          git pull --rebase origin main
          node scripts/validate-published-boards.mjs --base origin/main
          git push origin HEAD:main
