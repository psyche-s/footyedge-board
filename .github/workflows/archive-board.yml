name: Archive FootyEdge Published Board

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-board.yml"
      - "data/daily-odds-*.json"
      - "data/daily-insights-*.json"
  schedule:
    # 06:40 Toronto, both DST and standard-time UTC offsets.
    - cron: "40 10 * * *"
    - cron: "40 11 * * *"
    # 07:55 fallback if the morning capture was delayed/missed.
    - cron: "55 11 * * *"
    - cron: "55 12 * * *"
    # 23:50 final fallback for the current day.
    - cron: "50 3 * * *"
    - cron: "50 4 * * *"
  workflow_dispatch:
    inputs:
      board_date:
        description: 'Optional Toronto board date (today only; validated inputs required)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: footyedge-board-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture immutable published board
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          ARCHIVE_DATE: ${{ inputs.board_date }}
          FORCE_ARCHIVE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node scripts/archive-board.mjs
      - name: Commit board archive
        run: |
          if git diff --quiet -- data/boards; then
            echo "No new board archive."
            exit 0
          fi
          git config user.name "FootyEdge Archive Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/boards
          git commit -m "chore(board): freeze published FootyEdge board [skip ci]"
          git pull --rebase origin main
          node scripts/validate-published-boards.mjs --base origin/main
          git push origin HEAD:main
