name: Publish FootyEdge Daily Frozen Board

on:
  schedule:
    # GitHub timezone-aware schedule keeps 00:05 Toronto through DST.
    - cron: "5 0 * * *"
      timezone: "America/Toronto"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footyedge-original-sole-daily-refresh
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toronto 00:05 publication window (tolerates GitHub scheduler delay)
        id: gate
        shell: bash
        run: |
          HOUR="$(TZ=America/Toronto date +%H)"
          MINUTE="$(TZ=America/Toronto date +%M)"
          TODAY="$(TZ=America/Toronto date +%F)"
          MINUTES_SINCE_MIDNIGHT=$((10#$HOUR * 60 + 10#$MINUTE))
          RUN=false
          # GitHub scheduled runs may arrive hours late. Permit a delayed same-day
          # recovery after 00:05 and before noon only while today's write-once
          # archive is absent. One timezone-aware cron and this write-once
          # guard prevent a second publication of an already completed board.
          if (( MINUTES_SINCE_MIDNIGHT >= 5 && MINUTES_SINCE_MIDNIGHT < 720 )) && [[ ! -f "data/boards/$TODAY.json" ]]; then
            RUN=true
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "Official 00:05 Toronto gate=$RUN; current Toronto time=$HOUR:$MINUTE; board=data/boards/$TODAY.json"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Refresh fixture horizon and public-domain score history (single writer)
        if: steps.gate.outputs.run == 'true'
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          FOOTBALL_DATA_HUB_TOKEN: ${{ secrets.FOOTBALL_DATA_HUB_READ_TOKEN }}
          HUB_HISTORY_MODE: daily
          HUB_HISTORY_START_YEAR: '2015'
        shell: bash
        run: |
          node scripts/refresh-fixture-horizon.mjs || echo "::warning::Fixture horizon source unavailable; retained last good."
          TODAY="$(TZ=America/Toronto date +%F)"
          KEY="${TODAY//-/}"
          mkdir -p "data/$TODAY"
          if curl --fail --silent --show-error --max-time 16 --retry 1               "https://footyedge-board.vercel.app/api/espn-scoreboard?dates=$KEY&limit=1000"               -o "/tmp/original-scoreboard-$KEY.json" &&
             jq -e '.events | type=="array"' "/tmp/original-scoreboard-$KEY.json" >/dev/null; then
            cp "/tmp/original-scoreboard-$KEY.json" "data/$TODAY/scoreboard.json"
            echo "Captured dated scoreboard. Scheduled events are not treated as completed."
          else
            echo "::warning::Scoreboard unavailable; preserve last good snapshot and grade only verified finals."
          fi
          node --test tests/football-hub.test.mjs tests/h2h-archive.test.mjs tests/source-registry.test.mjs
          node scripts/sync-football-data-hub.mjs || echo "::warning::CC0 history unavailable; preserving existing verified archive."
          node scripts/audit-data-sources.mjs || echo "::warning::Source freshness audit unavailable."

      - name: Validate whole-slip grading and ensure dated research exists
        if: steps.gate.outputs.run == 'true'
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          FOOTYEDGE_ASIA_FEED_URL: ${{ secrets.FOOTYEDGE_ASIA_FEED_URL }}
          FOOTYEDGE_ASIA_FEED_TOKEN: ${{ secrets.FOOTYEDGE_ASIA_FEED_TOKEN }}
          FOOTYEDGE_ASIA_FEED_APPROVED: ${{ vars.FOOTYEDGE_ASIA_FEED_APPROVED }}
          FOOTYEDGE_TEAM_NEWS_FEED_URL: ${{ secrets.FOOTYEDGE_TEAM_NEWS_FEED_URL }}
          FOOTYEDGE_TEAM_NEWS_FEED_TOKEN: ${{ secrets.FOOTYEDGE_TEAM_NEWS_FEED_TOKEN }}
          FOOTYEDGE_TEAM_NEWS_FEED_APPROVED: ${{ vars.FOOTYEDGE_TEAM_NEWS_FEED_APPROVED }}
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/track-slip-performance.test.mjs
          TODAY="$(TZ=America/Toronto date +%F)"
          node scripts/sync-asia-research.mjs
          # Refresh exact-day research once, even when a dated earlier build exists.
          # The builder keeps previous verified file if provider collection fails.
          if ! FORCE_RESEARCH=1 RESEARCH_DATE="$TODAY" node scripts/build-research-base.mjs; then
            if [[ -s "data/research-base-$TODAY.json" ]]; then
              echo "::warning::Research provider failed; retaining dated baseline for review."
            else
              echo "::error::No current-date verified research. Stop without fabricating picks."
              exit 1
            fi
          fi
          if [[ ! -s "data/research-base-$TODAY.json" ]]; then
            echo "::error::Exact-date research missing. Cannot publish guesses."
            exit 1
          fi
          node --test tests/sync-team-news.test.mjs
          node scripts/sync-team-news.mjs
          if [[ -s "data/team-intelligence/$TODAY.json" ]]; then
            jq -e --arg day "$TODAY" '.date==$day and (.fixtures|type=="array")' "data/team-intelligence/$TODAY.json" >/dev/null
            echo "Dated predicted-lineup/news file available; predictions are not confirmed starting XIs."
          else
            echo "::warning::No verified dated team news/predicted XI file; player-dependent picks must PASS."
          fi


      - name: Prepare sourced H2H, match statistics, market review and shadow model
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
        run: |
          TODAY="$(TZ=America/Toronto date +%F)"
          if [[ -s "data/research-base-$TODAY.json" ]]; then
            node --test tests/h2h-score-cache.test.mjs tests/market-diversity.test.mjs
            H2H_DATE="$TODAY" node scripts/build-h2h-cache.mjs || echo "::warning::Current H2H unavailable."
            timeout 200s python scripts/analytics_pipeline.py --date "$TODAY" || echo "::warning::Source-matched shots/fouls research unavailable."
            node scripts/review-result-markets.mjs "$TODAY" || echo "::warning::Market review unavailable."
            # Research-only forecasts never rewrite official picks.
            timeout 240s python scripts/shadow_dixon_coles.py --capture-candidate --capture-expansion || echo "::warning::Shadow forecast unavailable; official model unaffected."
          fi

      - name: Build all-fixture 10000-draw experimental score and WDL forecast (shadow only)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          FOOTYEDGE_STYLE_FEED_URL: ${{ secrets.FOOTYEDGE_STYLE_FEED_URL }}
          FOOTYEDGE_STYLE_FEED_TOKEN: ${{ secrets.FOOTYEDGE_STYLE_FEED_TOKEN }}
          FOOTYEDGE_STYLE_FEED_APPROVED: ${{ vars.FOOTYEDGE_STYLE_FEED_APPROVED }}
        run: |
          node scripts/sync-experimental-standings.mjs || echo "::warning::Optional standings unavailable; run conservative history-only model."
          node scripts/sync-style-matchups.mjs || echo "::warning::Optional verified style-event feed unavailable."
          node --test tests/experimental-simulations.test.mjs tests/advanced-matchups.test.mjs
          node scripts/simulate-fixtures.mjs
          node scripts/simulate-matchups-v3.mjs

      - name: Build daily match-level researched Top 3 overlay without modifying frozen picks
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          node --test tests/top3-research-overlay.test.mjs tests/reviewed-slips.test.mjs
          node scripts/build-top3-review.mjs
          node scripts/snapshot-slip-market-reference.mjs
          node scripts/build-odds-reviewed-slips.mjs

      - name: Settle prior boards and ingest post-match learning before picks
        if: steps.gate.outputs.run == 'true'
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          FORCE_TRACK: '1'
        run: |
          node scripts/track-performance.mjs
          node scripts/track-slip-performance.mjs
          node scripts/postmatch-learning.mjs

      - name: Generate daily Top 3 and Top 5 from source-verified confidence only
        if: steps.gate.outputs.run == 'true'
        env:
          OWNER_RESEARCH_PICKS: "1"
        run: node scripts/build-evidence-only-board.mjs

      # Missing leagues are restored from independently verified dated research.
      # If native bookmaker quota is exhausted, publish evidence-only leans with
      # null odds and null EV rather than backfilling stale sportsbook prices.
      - name: Compare licensed editorial research, rank three per game and daily five
        if: steps.gate.outputs.run == 'true'
        env:
          FOOTYEDGE_RESEARCH_FEED_URL: ${{ secrets.FOOTYEDGE_RESEARCH_FEED_URL }}
          FOOTYEDGE_RESEARCH_FEED_TOKEN: ${{ secrets.FOOTYEDGE_RESEARCH_FEED_TOKEN }}
          FOOTYEDGE_RESEARCH_FEED_APPROVED: ${{ vars.FOOTYEDGE_RESEARCH_FEED_APPROVED }}
        run: |
          node --test tests/apply-editorial-consensus.test.mjs
          node scripts/apply-editorial-consensus.mjs

      - name: Replace candidate picks with dated, licensed editorial reviews only
        if: steps.gate.outputs.run == 'true'
        env:
          FOOTYEDGE_RESEARCH_FEED_URL: ${{ secrets.FOOTYEDGE_RESEARCH_FEED_URL }}
          FOOTYEDGE_RESEARCH_FEED_TOKEN: ${{ secrets.FOOTYEDGE_RESEARCH_FEED_TOKEN }}
          FOOTYEDGE_RESEARCH_FEED_APPROVED: ${{ vars.FOOTYEDGE_RESEARCH_FEED_APPROVED }}
        run: |
          node --check scripts/build-editorial-desk.mjs
          node --test tests/editorial-refresh.test.mjs
          node scripts/build-editorial-desk.mjs

      - name: Cross-check available dated previews and independently screen match history
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          node --check scripts/build-review-shortlist.mjs
          node --test tests/build-review-shortlist.test.mjs
          node scripts/build-review-shortlist.mjs

      - name: Publish and lock current-day source-reviewed picks once
        if: steps.gate.outputs.run == 'true'
        run: node scripts/archive-board.mjs

      - name: Ensure three-to-five leg parlay rules and source-only slip coverage
        if: steps.gate.outputs.run == 'true'
        run: |
          node --test tests/daily-slips.test.mjs tests/editorial-refresh.test.mjs
          # The authorised editorial desk was frozen above. No model-built
          # slip overwrites it or the immutable official board.

      - name: Audit match, lineup and league-SGP completeness without changing the UI
        if: steps.gate.outputs.run == 'true'
        run: |
          node --check scripts/audit-daily-refresh.mjs
          node scripts/audit-daily-refresh.mjs

      - name: Check non-priced percentage integrity
        if: steps.gate.outputs.run == 'true'
        run: node scripts/validate-public-metrics.mjs

      - name: Audit published board editorial quality
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/audit-editorial-board.mjs


      - name: Validate and commit immutable same-day picks
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          TODAY="$(TZ=America/Toronto date +%F)"
          mkdir -p data/board-drafts data/boards
          node scripts/validate-published-boards.mjs --base origin/main
          node scripts/validate-public-metrics.mjs
          git config user.name "FootyEdge Board Bot"
          git config user.email "actions@users.noreply.github.com"
          files=(data/performance data/postmortems data/football-hub data/h2h data/analytics data/market-reviews data/experimental-simulations data/experimental-inputs data/pick-reviews data/slips-reviewed data/slip-market-snapshots)
          if [[ -d data/refresh-health ]]; then files+=(data/refresh-health); fi
          if [[ -d data/style-matchups ]]; then files+=(data/style-matchups); fi
          for file in "data/$TODAY/fixtures.json" "data/$TODAY/scoreboard.json"; do
            if [[ -f "$file" ]]; then files+=("$file"); fi
          done
          TOMORROW="$(TZ=America/Toronto date -d "$TODAY +1 day" +%F)"
          for file in "data/research-base-$TOMORROW.json" "data/board-drafts/$TOMORROW.json" "data/model-shadow/$TODAY.json" "data/model-candidates/$TODAY.json" "data/model-candidates-expanded/$TODAY.json" "data/market-reviews/$TODAY.json" "data/analytics/$TODAY.json"; do
            if [[ -f "$file" ]]; then files+=("$file"); fi
          done
          if [[ -f "data/research-base-$TODAY.json" ]]; then files+=("data/research-base-$TODAY.json"); fi
          if [[ -d data/asia ]]; then files+=("data/asia"); fi
          if [[ -f "data/team-intelligence/$TODAY.json" ]]; then files+=("data/team-intelligence/$TODAY.json"); fi
          for file in "data/board-drafts/$TODAY.json" "data/boards/$TODAY.json" "data/daily-odds-$TODAY.json" "data/editorial-desk/$TODAY.json"; do
            if [[ -f "$file" ]]; then files+=("$file"); fi
          done
          git add -A -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No board changes."
            exit 0
          fi
          git commit -m "chore(board): freeze same-day Top 5 $TODAY [skip ci]"
          # Park unrelated generated model files so publication can rebase cleanly.
          git stash push --include-untracked -m "FootyEdge daily auxiliary files" || true
          git pull --rebase origin main
          node scripts/validate-published-boards.mjs --base origin/main
          git push origin HEAD:main
          git stash pop || echo "::warning::Unrestored auxiliary files remain stashed; official board already pushed."

      - name: Publish frozen Top 5 to GitHub Releases when picks qualify
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Toronto date +%F)"
          if ! jq -e '.top5 | length > 0' "data/boards/$TODAY.json" >/dev/null; then
            echo "No qualifying Top 5 for $TODAY; PASS-only board is already published."
            exit 0
          fi
          # Release data only after the board exists, is locked and passes export checks.
          node scripts/export-release-top5.mjs
          archive="footyedge-board-${TODAY}"
          current="footyedge-board-current"
          if ! gh release view "$archive" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$archive" --repo "$GH_REPO" --target main --title "FootyEdge frozen Top 5 $TODAY" --notes-file published/footyedge-top5.json --latest=false
          fi
          if gh release view "$current" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$current" --repo "$GH_REPO" --notes-file published/footyedge-top5.json
          else
            gh release create "$current" --repo "$GH_REPO" --target main --title "FootyEdge current Top 5" --notes-file published/footyedge-top5.json --latest=false
          fi
          echo "Published frozen Top 5 as release data; no website build required."

      - name: Collect player photos and tomorrow research after today’s picks publish
        if: steps.gate.outputs.run == 'true'
        shell: bash
        continue-on-error: true
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          PHOTO_DAYS: '5'
          PHOTO_MAX_TEAMS: '85'
        run: |
          TODAY="$(TZ=America/Toronto date +%F)"
          TOMORROW="$(TZ=America/Toronto date -d "$TODAY +1 day" +%F)"
          node --test tests/player-photo-refs.test.mjs tests/player-profile.test.mjs tests/ten-appearance-squad.test.mjs
          if node scripts/sync-player-photo-refs.mjs; then
            if ! node --test tests/player-photo-refs.test.mjs tests/player-profile.test.mjs tests/ten-appearance-squad.test.mjs; then
              echo "::warning::Photo validation failed; restore checked references."
              git restore -- data/player-photo-refs.json assets/player-photo-registry.js
            fi
          else
            echo "::warning::Photo source unavailable; preserve previously checked references."
            git restore -- data/player-photo-refs.json assets/player-photo-registry.js
          fi
          # Dated forward research remains a preview; cannot publish tomorrow's locked board.
          if [[ ! -e "data/boards/$TOMORROW.json" ]]; then
            FORCE_RESEARCH=1 RESEARCH_DATE="$TOMORROW" node scripts/build-research-base.mjs || echo "::warning::Tomorrow's research unavailable."
            if [[ -s "data/research-base-$TOMORROW.json" ]]; then
              H2H_DATE="$TOMORROW" node scripts/build-h2h-cache.mjs || echo "::warning::Tomorrow H2H unavailable."
            fi
          fi


      - name: Commit auxiliary player images and next-day research after current board is live
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=America/Toronto date +%F)"
          TOMORROW="$(TZ=America/Toronto date -d "$TODAY +1 day" +%F)"
          files=(data/player-photo-refs.json assets/player-photo-registry.js)
          for file in "data/research-base-$TOMORROW.json" "data/h2h/$TOMORROW.json"; do
            if [[ -f "$file" ]]; then files+=("$file"); fi
          done
          git config user.name "FootyEdge Daily Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No supplemental image/history changes."
            exit 0
          fi
          git commit -m "data(original): update verified player refs and next-day match research [skip ci]"
          # Keep unrelated generated artifacts out of auxiliary publication.
          git stash push --include-untracked -m "FootyEdge auxiliary residuals" || true
          git pull --rebase origin main
          node scripts/validate-published-boards.mjs --base origin/main
          git push origin HEAD:main

