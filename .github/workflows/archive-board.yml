name: Publish and Lock FootyEdge Board

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-board.yml"
  schedule:
    # EDT/EST alternatives for 00:30 Toronto; local-time gate rejects the other.
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footyedge-board-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toronto 00:30 gate
        id: gate
        shell: bash
        run: |
          DATE="$(TZ=America/Toronto date +%F)"
          HOUR="$(TZ=America/Toronto date +%H)"
          MINUTE="$(TZ=America/Toronto date +%M)"
          RUN=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RUN=true
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" && "$HOUR" == "00" && "$MINUTE" -ge 30 && "$DATE" != "2026-10-07" ]]; then
            RUN=true
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "Toronto date/time: $DATE $HOUR:$MINUTE; run=$RUN"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "22"

      - name: Install browser
        if: steps.gate.outputs.run == 'true'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify shadow model arrived before morning publication (advisory only)
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          # Refresh origin/main without changing the current checkout or official boards.
          git fetch --quiet origin main || echo "Shadow source ref refresh unavailable; publishing remains independent."
          node scripts/audit-shadow-refresh.mjs --ref origin/main

      - name: Build today's complete board only
        if: steps.gate.outputs.run == 'true'
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          PREVIEW_DAYS: "0"
          FORCE_TODAY_CAPTURE: "1"
        run: node scripts/publish-board-previews.mjs

      - name: Lock today's official board
        if: steps.gate.outputs.run == 'true'
        run: node scripts/archive-board.mjs

      - name: Validate and commit official board
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          TODAY="$(TZ=America/Toronto date +%F)"
          mkdir -p data/board-drafts data/boards
          node scripts/validate-published-boards.mjs --base origin/main
          git config user.name "FootyEdge Board Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- "data/board-drafts/$TODAY.json" "data/boards/$TODAY.json"
          if git diff --cached --quiet; then
            echo "No board changes."
            exit 0
          fi
          git commit -m "chore(board): publish and lock $TODAY at 12:30am Toronto [skip ci]"
          git pull --rebase origin main
          node scripts/validate-published-boards.mjs --base origin/main
          git push origin HEAD:main
