name: Publish FootyEdge Daily Frozen Board

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-board.yml"
  schedule:
    # 00:30 Toronto: 04:30 UTC during EDT, 05:30 UTC during EST.
    - cron: "30 4,5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footyedge-board-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strict 00:30 Toronto publication gate
        id: gate
        shell: bash
        run: |
          HOUR="$(TZ=America/Toronto date +%H)"
          MINUTE="$(TZ=America/Toronto date +%M)"
          RUN=false
          # A manual dispatch cannot bypass the official freeze window.
          if [[ "$HOUR" == "00" && "$MINUTE" == "30" ]]; then RUN=true; fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "Official 00:30 Toronto gate=$RUN; current Toronto time=$HOUR:$MINUTE"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "22"

      - name: Install browser
        if: steps.gate.outputs.run == 'true'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify shadow model arrived before morning publication (advisory only)
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          # Refresh origin/main without changing the current checkout or official boards.
          git fetch --quiet origin main || echo "Shadow source ref refresh unavailable; publishing remains independent."
          node scripts/audit-shadow-refresh.mjs --ref origin/main

      - name: Capture verified native sportsbook odds once
        if: steps.gate.outputs.run == 'true'
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
        run: node scripts/capture-native-odds.mjs

      - name: Evidence-only recovery when sportsbook quota is exhausted
        if: steps.gate.outputs.run == 'true'
        run: node scripts/build-evidence-only-board.mjs

      # Missing leagues are restored from independently verified dated research.
      # If native bookmaker quota is exhausted, publish evidence-only leans with
      # null odds and null EV rather than backfilling stale sportsbook prices.
      - name: Build today's complete board only
        if: steps.gate.outputs.run == 'true'
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          PREVIEW_DAYS: "0"
          FORCE_TODAY_CAPTURE: "1"
          FAST_CAPTURE: "1"
        shell: bash
        run: |
          TODAY="$(TZ=America/Toronto date +%F)"
          if timeout 145s node scripts/publish-board-previews.mjs; then
            echo "Refreshed same-day candidate draft."
          else
            echo "::warning::Browser capture failed. Retain current Top 5."
            FORCE_FALLBACK=1 node scripts/build-evidence-only-board.mjs
          fi

      - name: Publish and lock current-day picks once
        if: steps.gate.outputs.run == 'true'
        run: node scripts/archive-board.mjs

      - name: Reconcile prior hit rates and Top 3 post-match learning
        if: steps.gate.outputs.run == 'true'
        env:
          FOOTYEDGE_URL: https://footyedge-board.vercel.app
          FORCE_TRACK: '1'
        run: |
          # Never recalculate or overwrite archived selections themselves.
          node scripts/track-performance.mjs || echo "::warning::Tracking retry required; preserve board publication."
          node scripts/postmatch-learning.mjs || echo "::warning::Learning retry required; preserve board publication."

      - name: Validate and commit immutable same-day picks
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          TODAY="$(TZ=America/Toronto date +%F)"
          mkdir -p data/board-drafts data/boards
          node scripts/validate-published-boards.mjs --base origin/main
          git config user.name "FootyEdge Board Bot"
          git config user.email "actions@users.noreply.github.com"
          files=(data/performance data/postmortems)
          for file in "data/board-drafts/$TODAY.json" "data/boards/$TODAY.json" "data/daily-odds-$TODAY.json"; do
            if [[ -f "$file" ]]; then files+=("$file"); fi
          done
          git add -A -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No board changes."
            exit 0
          fi
          git commit -m "chore(board): freeze same-day Top 5 $TODAY [skip ci]"
          git pull --rebase origin main
          node scripts/validate-published-boards.mjs --base origin/main
          git push origin HEAD:main
