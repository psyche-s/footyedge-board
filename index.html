<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta name="theme-color" content="#031008">
<title>FootyEdge</title>
<style>
html,body{margin:0;min-height:100%;background:#031008;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;color:#94a99c;font-size:13px}
.spinner{width:26px;height:26px;border:3px solid #173624;border-top-color:#43df88;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="boot"><div><div class="spinner"></div>Loading FootyEdge…</div></div>
<script>
const PARTS=["/ui/part0.html?v=36","/ui/part1.html?v=36","/ui/part2.html?v=36"];
Promise.all(PARTS.map(url=>fetch(url,{cache:"no-store"}).then(r=>{
  if(!r.ok) throw new Error("UI bundle "+r.status);
  return r.text();
}))).then(parts=>{
  const html=parts.join("");
  document.open();
  document.write(html);
  document.close();
}).catch(err=>{
  console.error(err);
  document.getElementById("boot").innerHTML='<div style="padding:28px;text-align:center"><b style="color:#fff">Unable to load FootyEdge.</b><br><span style="color:#7f9388">Please refresh the page.</span></div>';
});
</script>
</body>
</html>
