<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FootyEdge</title>
<meta name="theme-color" content="#020503">
<style>
@import url("https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap");
:root{
  --bg:#020503;--panel:#061009;--panel2:#0a160f;--panel3:#0d1b12;
  --text:#edf7f0;--muted:#8da197;--green:#2ddf8b;--green2:#1ebd72;
  --line:#18271e;--amber:#f5a524;--red:#ff5c72;--gray:#7f8e86;
  --shadow:0 14px 38px rgba(0,0,0,.28)
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{
  margin:0;background:
  radial-gradient(circle at 70% -10%,rgba(45,223,139,.08),transparent 28rem),
  var(--bg);color:var(--text);font:14px/1.45 Manrope,Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))
}
button,select,input{font:inherit}
button{cursor:pointer}
a{color:inherit}
header{
  position:relative;z-index:20;overflow:hidden;
  background:linear-gradient(180deg,rgba(2,5,3,.94),rgba(2,5,3,.9));
  border-bottom:1px solid var(--line);
  padding:calc(6px + env(safe-area-inset-top)) 14px 7px;
  min-height:92px;
}
.headerLegends{
  position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);
  opacity:.34;pointer-events:none
}
.headerLegends img{
  width:100%;height:118%;object-fit:cover;object-position:center 24%;
  transform:translateY(-8%);filter:saturate(.9) contrast(1.06)
}
.headerLegends::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(2,5,3,.32),rgba(2,5,3,.66) 48%,rgba(2,5,3,.95)),
    linear-gradient(90deg,rgba(2,5,3,.84),rgba(2,5,3,.24) 42%,rgba(2,5,3,.82));
}
.head{position:relative;z-index:2;max-width:1180px;margin:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:34px}
.brand{display:flex;align-items:center;gap:10px}
.mark{
  width:38px;height:38px;position:relative;flex:0 0 38px;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.25));
}
.mark .ball{
  width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#ffffff 0 36%,#dbe7df 37% 60%,#b9c8bf 61% 100%);
  border:2px solid #0f1d16;position:absolute;left:4px;top:2px;
  box-shadow:0 2px 10px rgba(0,0,0,.18)
}
.mark .edge{
  position:absolute;right:2px;bottom:5px;width:21px;height:4px;border-radius:999px;
  background:linear-gradient(90deg,var(--green),#7cffb3);transform:rotate(-28deg);
  box-shadow:0 0 0 1px rgba(0,0,0,.16)
}
.mark .ground{
  position:absolute;left:2px;right:0;bottom:1px;height:2px;border-radius:999px;
  background:linear-gradient(90deg,transparent,rgba(45,223,139,.22),transparent)
}
.brandTitle{font-size:20px;font-weight:900;letter-spacing:-.7px}
.brandTitle b{color:var(--green)}
.brandSub{font-size:10px;color:var(--muted);letter-spacing:.9px;text-transform:uppercase}
.status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(45,223,139,.08)}
main{max-width:1180px;margin:auto;padding:14px;display:grid;gap:14px}
.card{background:linear-gradient(180deg,rgba(9,21,14,.98),rgba(5,14,9,.98));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.topbar{padding:8px 0 10px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:10px;background:transparent;border:0;box-shadow:none}
.btn{
  border:1px solid #24402f;background:#07110b;color:var(--text);border-radius:16px;padding:10px 12px;font-weight:800
}
.btn:hover,.btn.on{border-color:#44e892;background:#102217;color:var(--green)}
.btn.ghost{color:#c7d4cd;background:#08120c}
.navArrow{width:52px;height:52px;padding:0;display:grid;place-items:center;font-size:22px;line-height:1}
.dateCenter{border:0;background:transparent;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px 0}
.dateDay{font-size:22px;font-weight:800;letter-spacing:-.5px}
.dateDate{font-size:11px;color:var(--muted);font-weight:700}
.small{font-size:11px;color:var(--muted)}
.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:6px;padding:0 1px}
.sectionHead h2{font-size:20px;letter-spacing:-.6px;margin:0}.sectionHead p{margin:3px 0 0;color:#71837a;font-size:11px}
.bestGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.best{padding:14px 14px 13px;position:relative;overflow:hidden;border-radius:15px;background:linear-gradient(180deg,#08140c,#061009);box-shadow:none}
.best:before{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--green),transparent 78%)}
.bestNum{position:absolute;top:12px;right:13px;color:#23372c;font-size:28px;font-weight:900}
.matchMini{font-size:11px;color:var(--muted);padding-right:35px}
.pickName{font-size:17px;font-weight:900;line-height:1.15;margin:8px 0}
.pillRow{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:#08130c;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800}
.pill.green{color:var(--green);border-color:rgba(45,223,139,.35);background:rgba(45,223,139,.08)}
.pill.amber{color:var(--amber)}
.pill.red{color:var(--red)}
.why{margin-top:10px;color:#a8bab0;font-size:11px}
.filters{padding:10px;display:flex;gap:7px;overflow-x:auto;align-items:center}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.game{padding:13px;transition:.16s;border-color:#16271d;background:linear-gradient(180deg,#07130b,#061009);box-shadow:none}
.game:hover{border-color:#2b5941;transform:translateY(-1px)}
.gameTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.comp{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:10px;color:var(--muted)}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px;margin:13px 0}
.team{display:flex;align-items:center;gap:8px;min-width:0;font-weight:800}
.team.r{justify-content:flex-end;text-align:right}
.team span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{
  width:38px;height:38px;border-radius:50%;aspect-ratio:1/1;object-fit:cover;
  border:1px solid #31503b;background:#dfe9e2;flex:0 0 38px;overflow:hidden
}
.logo.lg{width:52px;height:52px;flex-basis:52px}
.vs{color:#617268;font-size:10px;font-weight:900}
.formRow{display:flex;gap:3px;align-items:center;justify-content:center;margin-top:-2px;margin-bottom:9px}
.form{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:9px;font-weight:900}
.form.W{background:rgba(45,223,139,.16);color:var(--green)}
.form.D{background:rgba(127,142,134,.15);color:#a5b1aa}
.form.L{background:rgba(255,92,114,.14);color:var(--red)}
.topPick{border-top:1px solid var(--line);padding-top:11px;display:flex;align-items:center;gap:9px}
.pickMeta{flex:1;min-width:0}
.pickMeta small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.7px}
.pickMeta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:21px;font-weight:950;color:var(--green)}
.altRow{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
.alt{font-size:9px;border:1px solid var(--line);border-radius:7px;padding:3px 5px;color:#9caea4}
.noPick{color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:10px}
.sourceLine{font-size:9px;color:#65766d;margin-top:9px}
.empty{padding:34px;text-align:center;color:var(--muted)}
footer{max-width:1180px;margin:16px auto 0;padding:0 14px 28px;color:#62736a;font-size:10px;text-align:center}
.modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modalWrap.on{display:flex}
.modal{background:#050d08;border:1px solid var(--line);border-radius:22px 22px 0 0;width:min(760px,100%);max-height:88vh;overflow:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}
.modalBar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-16px;background:#050d08;padding:12px 0;z-index:2;border-bottom:1px solid var(--line)}
.close{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#08120c;color:white}
.modalTeams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:18px 0}
.modalTeam{text-align:center;font-weight:900}.modalTeam img{display:block;margin:0 auto 7px}
.detailGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.metric{border:1px solid var(--line);background:#07110b;border-radius:11px;padding:9px;text-align:center}
.metric b{display:block;font-size:14px}.metric span{font-size:9px;color:var(--muted)}
.pickList{display:grid;gap:7px;margin-top:10px}
.pickRow{border:1px solid var(--line);background:#07110b;border-radius:12px;padding:10px;display:flex;gap:9px;align-items:center}
.pickRank{width:25px;height:25px;border-radius:8px;background:rgba(45,223,139,.1);color:var(--green);display:grid;place-items:center;font-weight:900}
.pickRow .grow{flex:1}.pickRow small{display:block;color:var(--muted);font-size:9px}
.pickValues{display:flex;gap:6px;align-items:stretch;margin-left:auto}
.valueBox{min-width:60px;border:1px solid var(--line);background:#09150e;border-radius:10px;padding:6px 7px;text-align:center}
.valueBox span{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.55px}
.valueBox b{display:block;font-size:12px;margin-top:1px}
.valueBox.ev.pos b{color:var(--green)}.valueBox.ev.neg b{color:var(--red)}
.crossBox{margin-top:10px;border:1px solid #244633;background:rgba(45,223,139,.055);border-radius:13px;padding:11px}
.crossHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.crossVerdict{font-size:9px;font-weight:900;border:1px solid #315d42;border-radius:999px;padding:3px 6px;color:var(--green)}
.statList{display:grid;gap:6px;margin-top:8px}
.statItem{border-left:2px solid #294936;padding:4px 0 4px 8px;color:#a8b9af;font-size:10px}
.news{margin-top:13px;border-top:1px solid var(--line);padding-top:12px}
.news h3{font-size:12px;margin:0 0 8px}
.newsText{color:#a8b9af;font-size:11px}
.playerGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.player{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:8px;background:#07110b}
.player img{width:37px;height:37px;border-radius:50%;object-fit:cover;background:#111}
.player b{font-size:11px}.player small{display:block;color:var(--muted);font-size:9px}
.loading{display:inline-block;width:15px;height:15px;border:2px solid #244331;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mobileNav{position:fixed;left:0;right:0;bottom:0;background:rgba(3,8,5,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:40;padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:none;justify-content:center;gap:6px}
.mobileNav button{flex:1;border:0;background:transparent;color:var(--muted);padding:7px;border-radius:11px;font-size:10px;font-weight:800}
.mobileNav button.on{color:var(--green);background:rgba(45,223,139,.08)}
@media(max-width:760px){
  header{min-height:84px}
  .head{padding-top:27px}
  .status .copy{display:none}
  .bestGrid,.games{grid-template-columns:1fr}
  .topbar{grid-template-columns:48px 1fr 48px;padding:7px 0 9px}
  .navArrow{width:48px;height:48px}
  .dateDay{font-size:19px}.dateDate{font-size:10px}
  .filterSelect{min-width:154px;font-size:14px;padding:13px 18px}
  .filter{padding:13px 20px;font-size:14px}
  .mobileNav{display:flex}.playerGrid{grid-template-columns:1fr}
  .pickRow{align-items:flex-start;flex-wrap:wrap}.pickValues{width:100%;margin-left:34px}.valueBox{flex:1}
}

/* FootyEdge UI refinement — mockup-aligned */
.headerLegends{display:none!important}
header{
  min-height:auto;
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;

}

  min-height:54px;
  padding-top:0;

}

}

.best{
  min-height:178px;
  padding:13px;
  display:flex;
  flex-direction:column;
}
.bestTeams{
  display:flex;

}
.logo.mini{

}
.matchMini{

}

}

@media(max-width:980px){
  .bestGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

</style>
</head>
<body>
<header>
  <div class="head">
    <div class="brand">
      <div class="mark"><div class="ball"></div><div class="edge"></div><div class="ground"></div></div>
      <div><div class="brandTitle">Footy<b>Edge</b></div><div class="brandSub">Soccer Intelligence</div></div>
    </div>
    <div class="status"><span class="dot"></span><span class="copy" id="statusText">Vercel · API-Football</span></div>
  </div>
</header>

<main>
  <section class="topbar">
    <button class="btn ghost navArrow" id="prevBtn" aria-label="Previous day">‹</button>
    <button class="dateCenter" id="todayBtn" type="button" aria-label="Jump to today">
      <span class="dateDay" id="dayTitle">Today</span>
      <span class="dateDate" id="dateLabel"></span>
    </button>
    <button class="btn ghost navArrow" id="nextBtn" aria-label="Next day">›</button>
  </section>

  <div class="sectionHead" id="topAnchor">
    <div><h2>Today’s Top Picks</h2><p id="topSub">Up to 5 picks at 85+ confidence.</p></div>
    <div class="small" id="dataStamp"></div>
  </div>
  <section class="bestGrid" id="bestGrid"></section>

  <section class="filterPanel" id="filters">
    <div class="filterGroup">
      <div class="filterTitle">League</div>
      <div class="filterRow">
        <select class="filterSelect" id="leagueSelect"><option value="all">All Leagues</option></select>
        <select class="filterSelect" id="statusSelect">
          <option value="upcoming">Upcoming</option>
          <option value="all">All Games</option>
          <option value="live">Live</option>
          <option value="completed">Completed</option>
        </select>
      </div>
    </div>
    <div class="filterGroup">
      <div class="filterTitle">Market</div>
      <div class="filterRow marketRow">
        <button class="btn filter on" data-filter="all">All Games</button>
        <button class="btn filter" data-filter="qualified">Qualified</button>
        <button class="btn filter" data-filter="core">4.5★+</button>
        <button class="btn filter" data-filter="Goals">Goals</button>
        <button class="btn filter" data-filter="BTTS">BTTS</button>
        <button class="btn filter" data-filter="Result">ML / Double Chance</button>
      </div>
    </div>
  </section>

  <section class="games" id="games"></section>
</main>

<footer>FootyEdge © Psyche 2026 · Model probabilities are estimates, not guarantees. Market data may move.</footer>

<div class="modalWrap" id="modalWrap">
  <div class="modal" id="modal">
    <div class="modalBar"><b>Match breakdown</b><button class="close" id="closeModal">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<nav class="mobileNav">
  <button class="on" onclick="document.getElementById('topAnchor').scrollIntoView()">★ Top Picks</button>
  <button onclick="document.getElementById('filters').scrollIntoView()">⚽ Matches</button>
</nav>

<script>
const TZ="America/Toronto";
const API="/api/football";
const state={date:null,fixtures:[],odds:new Map(),games:[],filter:"all",league:"all",statusMode:"upcoming",loading:false,predCache:new Map(),detailCache:new Map(),timers:[]};

const TODAY_PLAYBOOK={

function parseOddsItem(item){
  const books=item.bookmakers||[]; if(!books.length)return[];

    const inv=vals.map(v=>1/v.decimal),sum=inv.reduce((a,b)=>a+b,0)||1;

      }else if(name.includes("double chance")){

        category="Goals";label=v.value.replace(/(\d)(?=\d)/,"$1");
      }else if(name.includes("both teams")&&name.includes("score")){
        category="BTTS";label=`BTTS ${/yes/i.test(v.value)?"Yes":"No"}`;
      }else if(name.includes("home team total")||name.includes("home goals")){
        if(/(?:Over|Under)\s*\d/i.test(v.value)){category="Team Goals";teamSide="home";label=`${item._home} ${v.value}`}
      }else if(name.includes("away team total")||name.includes("away goals")){
        if(/(?:Over|Under)\s*\d/i.test(v.value)){category="Team Goals";teamSide="away";label=`${item._away} ${v.value}`}
      }else if(name.includes("score or assist")){

  }else if(c.category==="Double Chance"){
    if(c.label.includes(g.home.name)&&/Draw/.test(c.label))model=h+d;
    else if(c.label.includes(g.away.name)&&/Draw/.test(c.label))model=a+d;

  }else{

  const defH=numericPct(comp.def?.home),defA=numericPct(comp.def?.away);
  const poiH=numericPct(comp.poisson_distribution?.home),poiA=numericPct(comp.poisson_distribution?.away);

  if(/under/i.test(label)){
    parts.push("The model favors the protected under when the scoring projection, defensive inputs and market-implied total point in the same lower-event direction.");
  }else if(/over/i.test(label)){
    parts.push("The goals angle is supported when the attacking profile and projected scoring output clear the selected total with enough margin.");
  }else if(/btts/i.test(label)){
    parts.push(/yes/i.test(label)
      ?"Both teams' scoring and conceding profiles support chances at each end."
      :"The cleaner edge comes from at least one attack being projected to stay below a reliable scoring level.");
  }else if(/draw no bet|double chance| or draw/i.test(label)){
    parts.push("The protected result market is preferred because the stronger side has the form/matchup edge without requiring a full moneyline win.");
  }else if(/\bml\b|moneyline| win/i.test(label)){
    parts.push("The result pick is backed by the stronger overall form, matchup and model win profile.");
  }

  if(formH!=null&&formA!=null&&Math.abs(formH-formA)>=8){
    const side=formH>formA?g.home.name:g.away.name;
    parts.push(`${side} holds the clearer recent-form edge in the prediction comparison.`);
  }
  if(attH!=null&&attA!=null&&Math.abs(attH-attA)>=10){
    const side=attH>attA?g.home.name:g.away.name;
    parts.push(`${side} rates better on the attacking comparison.`);
  }
  if(defH!=null&&defA!=null&&Math.abs(defH-defA)>=10){
    const side=defH>defA?g.home.name:g.away.name;
    parts.push(`${side} carries the stronger defensive comparison.`);
  }
  if(poiH!=null&&poiA!=null&&Math.abs(poiH-poiA)>=10){
    const side=poiH>poiA?g.home.name:g.away.name;
    parts.push(`The Poisson layer also leans toward ${side}.`);
  }

  const advice=pred?.predictions?.advice;
  if(advice&&!parts.some(x=>String(x).includes(advice)))parts.push(String(advice));

  const unique=[...new Set(parts.map(x=>String(x).trim()).filter(Boolean))];
  return unique.slice(0,4).join(" ");
}
function statMetric(v){return v==null||v===""?"—":String(v)}
function formatComp(pred){
  const c=pred?.comparison;if(!c)return"";
  return `<div class="news"><h3>Model stats</h3><div class="detailGrid">
    <div class="metric"><b>${esc(statMetric(c.form?.home))}</b><span>Home form</span></div>
    <div class="metric"><b>${esc(statMetric(c.form?.away))}</b><span>Away form</span></div>
    <div class="metric"><b>${esc(statMetric(c.h2h?.home))} / ${esc(statMetric(c.h2h?.away))}</b><span>H2H edge</span></div>
    <div class="metric"><b>${esc(statMetric(c.att?.home))} / ${esc(statMetric(c.att?.away))}</b><span>Attack</span></div>
    <div class="metric"><b>${esc(statMetric(c.def?.home))} / ${esc(statMetric(c.def?.away))}</b><span>Defence</span></div>
    <div class="metric"><b>${esc(statMetric(c.poisson_distribution?.home))} / ${esc(statMetric(c.poisson_distribution?.away))}</b><span>Poisson</span></div>
  </div></div>`;
}

async function openMatch(id){
  const g=state.games.find(x=>x.id===id);if(!g)return;
  document.getElementById("modalWrap").classList.add("on");
  const body=document.getElementById("modalBody");
  body.innerHTML=`<div class="modalTeams"><div class="modalTeam">${logo(g.home,"lg")}${esc(g.home.name)}</div><b>${statusText(g)}</b><div class="modalTeam">${logo(g.away,"lg")}${esc(g.away.name)}</div></div><div class="empty"><span class="loading"></span><br>Applying the model and building the match analysis…</div>`;

  const pred=await ensurePrediction(g);
  renderAll();

  let detail=state.detailCache.get(id);
  if(!detail){
    const inj=await Promise.allSettled([rawApi("injuries",{fixture:id})]);
    detail={pred,injuries:inj[0].status==="fulfilled"?(inj[0].value.response||[]):[]};
    state.detailCache.set(id,detail);
  }else{
    detail.pred=pred||detail.pred;
  }

  const picks=diversified(g);
  const commentary=supportingCommentary(g,detail.pred);

  body.innerHTML=`<div class="modalTeams"><div class="modalTeam">${logo(g.home,"lg")}${esc(g.home.name)}</div><b>${statusText(g)}</b><div class="modalTeam">${logo(g.away,"lg")}${esc(g.away.name)}</div></div>
    <div class="news"><h3>Our model</h3>
      <div class="pickList">${picks.map((c,i)=>`<div class="pickRow">
        <div class="pickRank">${i+1}</div>
        <div class="grow"><small>${esc(c.category)}</small><b>${esc(c.label)}</b><small>${esc(pickWhy(g,c))}</small></div>
        <div class="pickValues">
          <div class="valueBox"><span>Odds</span><b>${c.american!=null?(c.american>0?"+":"")+c.american:oddText(c.decimal)}</b></div>
          <div class="valueBox ev ${c.ev!=null&&c.ev>=0?"pos":"neg"}"><span>EV</span><b>${c.ev!=null?evText(c.ev):"—"}</b></div>
          <div class="valueBox"><span>Score</span><b>${c.score}</b></div>
        </div>
      </div>`).join("")||`<div class="newsText">No qualified markets returned.</div>`}</div>
    </div>

    ${formatComp(detail.pred)}

    <div class="news"><h3>Why this pick</h3>
      <div class="newsText">${esc(commentary||"The current model probability, matchup inputs and market price support this as the highest-ranked angle for the fixture. Recheck line movement and confirmed lineups closer to kickoff.")}</div>
    </div>

    <div class="news"><h3>Injuries</h3><div class="newsText">${detail.injuries.length?detail.injuries.slice(0,8).map(x=>`${esc(x.player?.name)} — ${esc(x.player?.reason||"listed")}`).join("<br>"):"No injury entries returned for this fixture."}</div></div>`;
}
function scheduleRefreshes(){
  state.timers.forEach(clearTimeout);state.timers=[];
}
function setDate(d){state.date=d;state.predCache.clear();state.detailCache.clear();loadBoard()}
document.getElementById("prevBtn").onclick=()=>setDate(dateAdd(state.date,-1));
document.getElementById("nextBtn").onclick=()=>setDate(dateAdd(state.date,1));
document.getElementById("todayBtn").onclick=()=>setDate(etDate());
document.getElementById("leagueSelect").onchange=e=>{state.league=e.target.value;renderGames();renderBest()};
document.getElementById("statusSelect").onchange=e=>{state.statusMode=e.target.value;renderGames();renderBest();renderKpis()};
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("on"));b.classList.add("on");state.filter=b.dataset.filter;renderGames()});
document.getElementById("closeModal").onclick=()=>document.getElementById("modalWrap").classList.remove("on");
document.getElementById("modalWrap").onclick=e=>{if(e.target.id==="modalWrap")e.currentTarget.classList.remove("on")};

state.date=etDate();loadBoard();
window.openMatch=openMatch;
</script>
