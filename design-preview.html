<body><div class="demo-banner"><span class="demo-dot"></span><b>DESIGN PREVIEW</b> — separate branch · not the production website · live research is not changed</div>
<div class="app"><header class="topnav"><div class="brand"><span class="brand-ball">⚽</span>FOOTYEDGE</div><nav class="navlinks" id="toplinks"></nav><button type="button" class="search" id="searchTrigger"><span>⌕</span> Search fixtures, teams…</button></header>
<div class="layout"><aside class="rail" id="rail"></aside><main class="main" id="content"><div class="empty">Opening the design preview…</div></main></div></div>
<nav class="mobile-nav" id="mobileNav"></nav>
<script>
(function(){
"use strict";
var BOARD_DATE="2026-10-30",views=[["fixtures","Fixtures","⚽"],["match","Match","⚔"],["player","Players","♟"],["top","Top Picks","★"],["projections","Projections","▥"],["leagues","Leagues","◉"]];
var S={view:"fixtures",games:[],desk:null,selected:0,league:"all",player:null,playerComp:"all",loaded:false,query:""};
var el=document.getElementById("content");
function h(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function clamp(n){return Math.min(100,Math.max(0,Number(n)||0))}
function logo(src,alt){var safe=/^https:\/\/a\.espncdn\.com\/i\/teamlogos\/soccer\/[\w/.-]+\.png$/i.test(src||"");return safe?'<img class="crest" src="'+h(src)+'" alt="'+h(alt)+' logo" loading="lazy" onerror="this.style.display=\'none\'">':'<span class="league-icon">'+h(String(alt||"?").slice(0,2).toUpperCase())+'</span>'}
function teamLogo(g,side){return logo(g&&g.teams&&g.teams[side]&&g.teams[side].logo,side==="home"?g.home:g.away)}
function dateHuman(raw){if(!raw)return "Kickoff TBC";var dt=new Date(raw);return Number.isNaN(dt.getTime())?"Kickoff TBC":new Intl.DateTimeFormat("en-CA",{timeZone:"America/Toronto",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",hour12:true}).format(dt)+" ET"}
function kickTime(raw){if(!raw)return "TBC";var dt=new Date(raw);return Number.isNaN(dt.getTime())?"TBC":new Intl.DateTimeFormat("en-CA",{timeZone:"America/Toronto",hour:"numeric",minute:"2-digit",hour12:true}).format(dt)}
function initials(name){return String(name||"").split(/\s+/).filter(Boolean).map(function(x){return x[0]}).slice(0,2).join("").toUpperCase()}
function pickLabel(p){return h(p&&p.label||"Research pending")}
function pct(p){var n=Number(p&&p.confidenceRating);return Number.isFinite(n)&&n>0?n+" research grade":"Editorial choice"}
function header(title,desc){return '<div class="page-header"><div><div class="eyebrow">FOOTYEDGE / REDESIGN CONCEPT</div><h1>'+h(title)+'</h1><div class="subhead">'+desc+'</div></div><span class="tag">Preview build · Oct 30</span></div>'}
function heading(t,meta){return '<div class="section-head"><h2>'+h(t)+'</h2><small>'+h(meta||"")+'</small></div>'}
function nav(){document.getElementById("toplinks").innerHTML=views.map(function(x){return '<button class="navlink '+(S.view===x[0]?"active":"")+'" data-view="'+x[0]+'">'+h(x[1])+'</button>'}).join("");document.getElementById("mobileNav").innerHTML=views.filter(function(x){return x[0]!=="match"}).map(function(x){return '<button data-view="'+x[0]+'" class="'+(S.view===x[0]?"active":"")+'"><span>'+x[2]+'</span>'+h(x[1])+'</button>'}).join("");document.getElementById("rail").innerHTML='<div class="rail-label">EXPLORE</div>'+views.map(function(x){return '<button class="'+(S.view===x[0]?"active":"")+'" data-view="'+x[0]+'" aria-label="'+h(x[1])+'" title="'+h(x[1])+'">'+x[2]+'</button>'}).join("")+'<div class="railbreak"></div><div class="rail-label">LEAGUES</div>'+Array.from(new Set(S.games.map(function(g){return g.league}))).slice(0,7).map(function(k){var g=S.games.find(function(x){return x.league===k});return '<button title="'+h(g.leagueName)+'" data-league="'+h(k)+'">'+h(initials(g.leagueName))+'</button>'}).join("")}
function fixtures(){var list=S.games.filter(function(g){return S.league==="all"||g.league===S.league}).filter(function(g){return !S.query||String(g.home+" "+g.away+" "+g.leagueName).toLowerCase().includes(S.query.toLowerCase())});var t=header("Fixtures & Match Intelligence","Club-colour fixture cards, archived Top 3 selections and one-click match intelligence, using the Original board.");
var bar='<div class="hero-banner"><div><div class="eyebrow">TODAY’S FOOTBALL INTELLIGENCE</div><b>Every fixture. One research workspace.</b><p>Fixture data: '+BOARD_DATE+' · Editorial confidence grades are not win probabilities.</p></div><span class="tag">'+list.length+' fixtures visible</span></div>';
var tools='<div class="toolbar"><button class="pill '+(S.league==="all"?"active":"")+'" data-league="all">All leagues</button>'+Array.from(new Set(S.games.map(function(g){return g.league}))).map(function(k){var g=S.games.find(function(x){return x.league===k});return '<button class="pill '+(S.league===k?"active":"")+'" data-league="'+h(k)+'">'+h(g.leagueName)+'</button>'}).join("")+'</div>';
var cards=list.map(function(g){var i=S.games.indexOf(g);var ps=(g.top3||[]).slice(0,3);return '<article class="fixture" data-match="'+i+'" role="button" tabindex="0" aria-label="Open '+h(g.home)+' versus '+h(g.away)+'"><div class="fixture-upper" style="--home:#1a394d;--away:#293150"><div class="fixture-league">◈ '+h(g.leagueName||g.league)+' <span style="margin-left:auto">RESEARCH BOARD</span></div><div class="fixture-top"><div class="team">'+teamLogo(g,"home")+'<strong>'+h(g.home)+'</strong></div><div class="kick"><b>'+h(kickTime(g.date))+'</b><span>Kickoff ET</span></div><div class="team away">'+teamLogo(g,"away")+'<strong>'+h(g.away)+'</strong></div></div></div><div class="fixture-picks">'+(ps.length?ps.map(function(p){return '<span class="pick-chip">'+pickLabel(p)+'</span>'}).join(""):'<span class="pick-chip">Picks pending</span>')+'</div><div class="fixture-foot">Tap to open match analysis <em>→</em></div></article>'}).join("");
return t+bar+tools+(cards?'<div class="fixture-grid">'+cards+'</div>':'<div class="empty">No fixtures match this filter. The preview does not invent missing fixtures.</div>');
}
function formPills(s){return '<div class="form-pills">'+String(s||"").split(/\s+/).filter(function(x){return /^[WLD]$/.test(x)}).slice(0,5).map(function(x){return '<span class="'+x+'">'+x+'</span>'}).join("")+'</div>'}
function match(){var g=S.games[S.selected];if(!g)return header("Match Intelligence","Select a fixture from the board.")+'<div class="empty">No match has been loaded yet.</div>';
var ps=(g.top3||[]);var picks=ps.map(function(p,i){return '<div class="rank-row"><div class="rank-num">'+(i+1)+'</div><div class="rank-body"><b>'+pickLabel(p)+'</b><p>'+h(p.reason||"No published match-specific reasoning.")+'</p></div><span class="rating">'+h(pct(p))+'</span></div>'}).join("");
var home=g.model&&g.model.home||{},away=g.model&&g.model.away||{},trends=g.model&&g.model.trendFacts||[];
var statRows=[["Home scored in last ten",home.scored],["Away scored in last ten",away.scored],["Home BTTS in last ten",home.btts],["Away BTTS in last ten",away.btts]].map(function(row){return '<div class="statline"><span>'+row[0]+'</span><div class="bar"><i style="width:'+clamp(Number(row[1])*100)+'%"></i></div><b>'+(row[1]==null?"—":Math.round(Number(row[1])*100)+"%")+'</b></div>'}).join("");

'<div class="match-hero"><div class="match-hero-head"><div class="match-team">'+teamLogo(g,"home")+'<b>'+h(g.home)+'</b></div><div class="match-date"><strong>VS</strong><span>'+h(dateHuman(g.date))+'</span><p style="color:#77deb1;font-size:10px">'+h(g.leagueName)+'</p></div><div class="match-team">'+teamLogo(g,"away")+'<b>'+h(g.away)+'</b></div></div></div>'+
'<div class="tabs"><button class="active">Overview</button><button data-scrollto="matchPicks">Top 3</button><button data-scrollto="matchForm">Recent form</button><button data-scrollto="matchNews">Team news</button></div>'+
'<div class="columns"><div class="block-stack"><section class="section-card" id="matchPicks">'+heading("Top 3 selections","Published board selections")+'<div class="section-body">'+(picks||'<div class="empty">No selections available.</div>')+'</div></section><section class="section-card" id="matchForm">'+heading("Observed team form","Last ten matches where available")+'<div class="section-body"><div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:14px"><div><b>'+h(g.home)+'</b>'+formPills(home.form)+'</div><div style="text-align:right"><b>'+h(g.away)+'</b>'+formPills(away.form)+'</div></div>'+statRows+'</div></section></div>'+
'<div class="block-stack"><section class="section-card">'+heading("Research evidence","No fabricated model outputs")+'<div class="section-body">'+(trends.length?trends.slice(0,5).map(function(x){return '<div class="rank-row"><div class="rank-body"><p>'+h(x.text)+'</p></div></div>'}).join(""):'<div class="empty">No source-verified trend data available.</div>')+'</div></section><section class="section-card" id="matchNews">'+heading("Lineups & team news","Verification-first")+'<div class="section-body">'+(news||'<div class="empty">No verified team-news entries on the saved board. Predicted lineups will only appear after identity and source verification.</div>')+'</div></section></div></div>';
}
function verifiedPhoto(){return "https://a.espncdn.com/i/headshots/soccer/players/full/246847.png"}
function safeStats(){var a=S.player&&S.player.stats||[];var map={};a.forEach(function(x){if(x&&x.label!=null&&Number.isFinite(Number(x.value)))map[x.label]=Number(x.value)});return map}
function player(){var p=S.player&&S.player.player||{},valid=S.player&&S.player.status==="verified",name=valid?p.name:"Ahmed Touba",club=valid?p.team:"Le Havre AC",position=valid?p.position:"Defender",rows=valid?(S.player.recent||[]):[],stats=safeStats(),season=S.player&&S.player.competition||"Competition not verified";
var comps=Array.from(new Set(rows.map(function(x){return x.competition}).filter(Boolean)));var visible=rows.filter(function(x){return S.playerComp==="all"||x.competition===S.playerComp}).slice(0,10);
var head=header("Player Intelligence","A reference-inspired player portrait, detailed appearances and compact season panels. Verified data replaces mock figures when available.");
var hero='<div class="profile-rail"><span class="avatar selected">AT</span><span class="avatar">GK</span><span class="avatar">DF</span><span class="avatar">MF</span><span class="avatar">FW</span><span class="tag" style="margin-left:8px">Roster navigation · design preview</span></div><div class="profile-hero"><div class="shirt-num">#</div><div class="profile-hero-content"><img class="profile-club" alt="Le Havre club crest" src="https://a.espncdn.com/i/teamlogos/soccer/500/3236.png"><div class="eyebrow">PLAYER PROFILE</div><h1>'+h(name)+'</h1><h3>'+h(club)+' · '+h(position)+'</h3><div class="bio-grid"><div><small>NATIONALITY</small><b>'+h(p.nationality||"Not verified")+'</b></div><div><small>SHIRT NUMBER</small><b>'+h(p.jerseyNumber||"—")+'</b></div><div><small>HEIGHT</small><b>'+h(p.height||"—")+'</b></div><div><small>PREFERRED FOOT</small><b>'+h(p.dominantFoot||"—")+'</b></div></div></div><img class="profile-portrait" alt="Ahmed Touba player portrait" src="'+h(valid&&p.headshot||verifiedPhoto())+'" onerror="this.style.display=\'none\'"></div>';
var tabs='<div class="tabs"><button class="active">Overview</button><button data-scrollto="appearancePanel">Appearances</button><button data-scrollto="performancePanel">Statistics</button><button data-scrollto="performancePanel">Competition totals</button></div>';
var filter='<div class="comp-filter"><button data-comp="all" class="'+(S.playerComp==="all"?"active":"")+'">All competitions</button>'+comps.map(function(c){return '<button data-comp="'+h(c)+'" class="'+(S.playerComp===c?"active":"")+'">'+h(c)+'</button>'}).join("")+'</div>';
var fields=[["goals","G"],["assists","A"],["shots","SH"],["shotsOnTarget","SOT"],["minutes","MIN"],["foulsCommitted","FC"],["foulsWon","FW"],["yellowCards","YC"],["redCards","RC"]];
var table=visible.length?'<div class="table-scroll"><table class="data-table"><thead><tr><th>DATE</th><th>OPPONENT</th><th>COMPETITION</th>'+fields.map(function(f){return '<th title="'+f[0]+'">'+f[1]+'</th>'}).join("")+'</tr></thead><tbody>'+visible.map(function(r){return '<tr><td>'+h(r.date||"—")+'</td><td class="strong">'+h(r.opponent||"—")+'</td><td>'+h(r.competition||"—")+'</td>'+fields.map(function(f){return '<td>'+(r[f[0]]==null?"—":h(r[f[0]]))+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>':'<div class="empty">No verified recent appearances for this player'+(S.playerComp!=="all"?" in this competition":"")+'. Layout and player imagery remain visible for design review.</div>';
var metric=function(label){return stats[label]==null?"—":stats[label]};
var metricItems=["Goals","Assists","Shots","Shots on target"].map(function(k){return '<div><b>'+h(metric(k))+'</b><small>'+h(k)+'</small></div>'}).join("");
return head+hero+tabs+'<div class="player-grid"><section class="section-card" id="appearancePanel">'+heading("Recent appearances","Last 10 verified available")+'<div class="section-body">'+filter+table+'<div class="table-note">G goals · A assists · SH shots · SOT shots on target · MIN minutes · FC fouls committed · FW fouls won · YC yellow · RC red. Missing fields are not treated as zero.</div></div></section><div class="block-stack"><section class="section-card" id="performancePanel">'+heading("Season performance",season)+'<div class="section-body"><div class="comp-filter" style="margin-bottom:11px"><button class="active">'+h(season)+'</button><button disabled title="No verified independent competition totals">Other splits: unavailable</button></div><div class="season-feature"><div class="big-number"><strong>'+h(metric("Appearances"))+'</strong><small>Verified appearances</small></div><div class="mini-metrics">'+metricItems+'</div></div><div class="notice" style="margin:0">Only source-verified statistics for the reported competition are displayed; the site does not copy season totals into another competition.</div></div></section><section class="section-card">'+heading("Coverage & provenance","Verified fields only")+'<div class="section-body"><div class="statline"><span>Player identity</span><div></div><b>'+(valid?"Verified":"Pending")+'</b></div><div class="statline"><span>Season statistics</span><div></div><b>'+(S.player&&S.player.statsVerified?"Available":"Pending")+'</b></div><div class="statline"><span>Recent match logs</span><div></div><b>'+rows.length+'/10</b></div></div></section></div></div>';
}
function pickCard(t,status,desc,body){return '<div class="focus-card"><div class="eyebrow">'+h(t)+'</div><h2>'+h(status)+'</h2><p>'+h(desc)+'</p>'+body+'</div>'}
function topPicks(){var d=S.desk||{},sgp=d.sgp||{},acca=d.acca||{},all=(S.games||[]).filter(function(g){return g.top3&&g.top3.length});var accaLegs=(acca.legs||[]).map(function(l){return '<div class="slip-line"><span>✓</span><div><b>'+h(l.label||l.selection||l.pick||l.market||"Research leg")+'</b><small>'+h(l.fixture||l.match||l.game||"Cross-game research")+'</small></div></div>'}).join("");
var cards=pickCard("BEST SGP",String(sgp.status||"not published").toUpperCase(),"Only published and qualifying same-game selections can appear here.",'<button class="action" data-view="match">Review match board</button>')+pickCard("CROSS-GAME ACCA",String(acca.status||"not published").toUpperCase(),String((acca.legs||[]).length)+" recorded legs on the editorial desk; odds remain unverified.",'<button class="action" data-scrollto="accaPanel">Inspect research slip</button>')+pickCard("TOP MATCH SELECTIONS",String(all.length)+" games","Published fixture-level selections. A research rating is not a calibrated hit probability.",'<button class="action" data-view="fixtures">Open fixtures</button>');
var topRows=all.slice(0,9).map(function(g){var p=g.top3[0];return '<div class="rank-row"><div class="rank-num">★</div><div class="rank-body"><b>'+h(g.home)+' vs '+h(g.away)+'</b><p>'+pickLabel(p)+'</p></div><span class="rating">'+h(pct(p))+'</span></div>'}).join("");
return header("Top Picks & Parlays","Bet-slip inspired research cards; no fabricated odds, payout or combined probabilities.")+'<div class="notice">This is a UX preview. Check the sportsbook for current Ontario prices and availability before considering any selection.</div><div class="top-pick-grid">'+cards+'</div><div class="columns"><section class="section-card">'+heading("Fixture research selections","Top published angle per match")+'<div class="section-body">'+(topRows||'<div class="empty">No published selections found.</div>')+'</div></section><section class="section-card" id="accaPanel">'+heading("Cross-game research slip","Not a priced bet")+'<div class="section-body">'+(accaLegs?'<div class="slip-list">'+accaLegs+'</div>':'<div class="empty">No cross-game research slip is available.</div>')+'</div></section></div>';
}
function projections(){var games=S.games.slice(0,7);var content=games.map(function(g){var ho=g.model&&g.model.home||{},aw=g.model&&g.model.away||{};var hrate=ho.scored,arate=aw.scored;return '<section class="section-card" style="margin-bottom:11px"><div class="section-head"><h2>'+h(g.home)+' vs '+h(g.away)+'</h2><small>'+h(g.leagueName)+'</small></div><div class="section-body"><div class="statline"><span>Home scored (last 10)</span><div class="bar"><i style="width:'+clamp(Number(hrate)*100)+'%"></i></div><b>'+(hrate==null?"—":Math.round(Number(hrate)*100)+"%")+'</b></div><div class="statline"><span>Away scored (last 10)</span><div class="bar"><i style="width:'+clamp(Number(arate)*100)+'%"></i></div><b>'+(arate==null?"—":Math.round(Number(arate)*100)+"%")+'</b></div><button class="action" style="margin-top:12px" data-match="'+S.games.indexOf(g)+'">Full match evidence →</button></div></section>'}).join("");
return header("Projections & Form","An evidence-led visualization of observed rates, with simulated percentages omitted unless verified.")+'<div class="notice">The current historical rates below are not predictions or match-win probabilities. Forecast modules will remain unavailable when the required model inputs are incomplete.</div><div class="columns"><div>'+content+'</div><div class="block-stack"><div class="section-card">'+heading("Model integrity","Data-quality guardrails")+'<div class="section-body"><div class="rank-row"><div class="rank-body"><b>10,000-draw simulation</b><p>Only display after confirming each required input and run record.</p></div><span class="rating">Not verified</span></div><div class="rank-row"><div class="rank-body"><b>Team colours & opponent context</b><p>Revised layout allows team-specific bars and comparable-opponent evidence.</p></div></div><div class="rank-row"><div class="rank-body"><b>Historical form</b><p>Read from today's stored board when available.</p></div></div></div></div></div></div>';
}
function leagues(){var entries=Array.from(new Set(S.games.map(function(g){return g.league}))).map(function(k){var games=S.games.filter(function(g){return g.league===k});return {key:k,name:games[0].leagueName,count:games.length}});return header("Leagues & Competitions","Browse the men's competitions currently represented in the saved research board.")+'<div class="hero-banner"><div><div class="eyebrow">THE FOOTBALL NETWORK</div><b>Every league, one consistent visual system.</b><p>League badges, form, fixtures and match evidence use shared design tokens.</p></div><span class="tag">'+entries.length+' competitions</span></div><div class="league-list">'+entries.map(function(l){return '<button class="league-card" data-league="'+h(l.key)+'"><span class="league-icon">'+h(initials(l.name))+'</span><span><strong>'+h(l.name)+'</strong><small>'+l.count+' fixture'+(l.count===1?"":"s")+' on '+BOARD_DATE+'</small></span><span class="arrow">›</span></button>'}).join("")+'</div>'}
function render(){nav();el.innerHTML=({fixtures:fixtures,match:match,player:player,top:topPicks,projections:projections,leagues:leagues}[S.view]||fixtures)();document.title="FootyEdge Design Preview — "+views.find(function(x){return x[0]===S.view})[1]}
function setView(v){if(!views.some(function(x){return x[0]===v}))return;S.view=v;render();window.scrollTo({top:0,behavior:"instant"})}
document.addEventListener("click",function(e){var b=e.target.closest("[data-view],[data-match],[data-league],[data-comp],[data-scrollto]");if(!b)return;if(b.hasAttribute("data-view"))setView(b.getAttribute("data-view"));else if(b.hasAttribute("data-match")){S.selected=Number(b.getAttribute("data-match"))||0;setView("match")}else if(b.hasAttribute("data-league")){S.league=b.getAttribute("data-league");setView("fixtures")}else if(b.hasAttribute("data-comp")){S.playerComp=b.getAttribute("data-comp");render()}else if(b.hasAttribute("data-scrollto")){var target=document.getElementById(b.getAttribute("data-scrollto"));if(target)target.scrollIntoView({behavior:"smooth",block:"start"})}});
document.addEventListener("keydown",function(e){var b=e.target.closest("[data-match]");if(b&&(e.key==="Enter"||e.key===" ")){e.preventDefault();b.click()}});
document.getElementById("searchTrigger").addEventListener("click",function(){var q=prompt("Filter fixtures by club or league",S.query);if(q!==null){S.query=q;setView("fixtures")}});
async function load(){var results=await Promise.allSettled([fetch("/data/boards/"+BOARD_DATE+".json",{cache:"no-store"}).then(function(r){if(!r.ok)throw Error(r.status);return r.json()}),fetch("/data/editorial-desk/"+BOARD_DATE+".json",{cache:"no-store"}).then(function(r){if(!r.ok)throw Error(r.status);return r.json()}),fetch("/api/player-profile?league=fra.1&teamId=3236&name=Ahmed%20Touba&playerId=246847",{cache:"no-store"}).then(function(r){if(!r.ok)throw Error(r.status);return r.json()})]);var d=results[0].status==="fulfilled"?results[0].value:null;S.games=d&&Array.isArray(d.games)?d.games:[];S.desk=results[1].status==="fulfilled"?results[1].value:null;S.player=results[2].status==="fulfilled"?results[2].value:null;S.loaded=true;render()}
render();load();
})();
</script></body></html>
